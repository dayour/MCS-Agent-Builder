      }
    }

    function openClaudePanel() {
      if (!panelOpen) toggleClaudePanel();
    }

    function addTermTab(label) {
      const id = ++tabCounter;
      const tabLabel = label || `Session ${id}`;
      const container = document.getElementById('terminal-container');

      // Create terminal wrapper div (hidden until activated)
      const wrapEl = document.createElement('div');
      wrapEl.id = `term-wrap-${id}`;
      wrapEl.style.cssText = 'position:absolute;inset:0;display:none;padding:4px';
      container.appendChild(wrapEl);

      // Create xterm instance
      const t = new Terminal({
        theme: TERM_THEME,
        fontSize: 13,
        fontFamily: "'Cascadia Code', 'Consolas', 'Monaco', monospace",
        cursorBlink: true, cursorStyle: 'bar', scrollback: 10000, allowTransparency: true,
      });
      const fit = new FitAddon.FitAddon();
      t.loadAddon(fit);
      t.loadAddon(new WebLinksAddon.WebLinksAddon());
      t.open(wrapEl);

      // Connect WebSocket
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = location.hostname || 'localhost';
      const ws = new WebSocket(`${protocol}//${host}:8001/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'init', cols: t.cols, rows: t.rows }));
        updateTabStatus(id, 'running');
      };
      ws.onmessage = (e) => { t.write(e.data); };
      ws.onclose = () => { updateTabStatus(id, 'stopped'); };
      ws.onerror = () => { updateTabStatus(id, 'error'); };

      // Wire IO
      t.onData(data => { if (ws.readyState === WebSocket.OPEN) ws.send(data); });
      t.onResize(({ cols, rows }) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'resize', cols, rows }));
      });

      const tab = { id, label: tabLabel, term: t, ws, fitAddon: fit, el: wrapEl, status: 'starting' };
      termTabs.push(tab);
      switchTab(id);
      renderTermTabs();

      // Click container to focus active terminal
      wrapEl.addEventListener('click', () => t.focus());

      return tab;
    }

    function switchTab(id) {
      activeTabId = id;
      termTabs.forEach(t => {
        t.el.style.display = t.id === id ? 'block' : 'none';
      });
      renderTermTabs();
      setTimeout(() => {
        const tab = _getActiveTerm();
        if (tab && panelOpen) { tab.fitAddon.fit(); tab.term.focus(); }
      }, 50);
      // Update status display
      const tab = termTabs.find(t => t.id === id);
      document.getElementById('panel-status').textContent = tab ? (tab.status === 'running' ? '' : tab.status) : '';
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const idx = termTabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const tab = termTabs[idx];
      // Close websocket and dispose terminal
      try { tab.ws.close(); } catch {}
      try { tab.term.dispose(); } catch {}
      tab.el.remove();
      termTabs.splice(idx, 1);

      if (activeTabId === id) {
        // Switch to nearest tab or create new one
        if (termTabs.length > 0) {
          switchTab(termTabs[Math.min(idx, termTabs.length - 1)].id);
        } else {
          activeTabId = null;
          document.getElementById('panel-status').textContent = '';
        }
      }
      renderTermTabs();
    }

    function updateTabStatus(id, status) {
      const tab = termTabs.find(t => t.id === id);
      if (tab) tab.status = status;
      if (id === activeTabId) {
        document.getElementById('panel-status').textContent = status === 'running' ? '' : status;
      }
    }

    function renameTab(id, newLabel) {
      const tab = termTabs.find(t => t.id === id);
      if (tab) { tab.label = newLabel; renderTermTabs(); }
    }

    function renderTermTabs() {
      const container = document.getElementById('term-tabs');
      if (!container) return;
      container.innerHTML = termTabs.map(t => `
        <div onclick="switchTab(${t.id})" class="flex items-center gap-1 px-2 py-1 rounded text-[11px] cursor-pointer transition-colors shrink-0" style="background:${t.id === activeTabId ? '#1e293b' : 'transparent'};color:${t.id === activeTabId ? '#e2e8f0' : '#64748b'}">
          <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${t.status === 'running' ? '#22c55e' : t.status === 'error' ? '#ef4444' : '#64748b'}"></span>
          <span class="truncate max-w-[100px]">${t.label}</span>
          ${termTabs.length > 1 ? `<button onclick="closeTab(${t.id}, event)" class="ml-0.5 opacity-40 hover:opacity-100 transition-opacity" style="line-height:1">&times;</button>` : ''}
        </div>
      `).join('');
    }

    // Re-fit active terminal on window resize
    window.addEventListener('resize', () => {
      const tab = _getActiveTerm();
      if (tab && panelOpen) tab.fitAddon.fit();
    });

    // Legacy compat
    function newTerminal() { addTermTab(); }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =======================================================================
    // =======================================================================
    // Browser back/forward — full navigation history
    // =======================================================================
    let _navFromPop = false; // prevent double-push when popstate triggers navigation

    window.addEventListener('popstate', (e) => {
      const s = e.state;
      _navFromPop = true;
      try {
        if (!s || s.v === 'landing') {
          currentProject = null; wizardProjectId = null;
          document.getElementById('breadcrumb').innerHTML = '<span class="font-medium" style="color:var(--text)">Projects</span>';
          document.getElementById('landing-view').classList.remove('hidden');
          document.getElementById('project-view').classList.add('hidden');
          document.getElementById('wizard-view').classList.add('hidden');
          document.getElementById('doc-view').classList.add('hidden');
          renderSidebar(); renderLanding();
        } else if (s.v === 'project') { selectProject(s.id); }
        else if (s.v === 'wizard') { openWizard(s.pid, s.aid); }
        else if (s.v === 'doc') { selectProject(s.pid).then(() => openDocPage(s.key)); }
      } finally { _navFromPop = false; }
    });

    function navPush(state) { if (!_navFromPop) history.pushState(state, ''); }

    // Patch navigations to push history
    const _sp = selectProject;
    selectProject = async function(id) { navPush({v:'project',id}); return _sp(id); };
    const _ow = openWizard;
    openWizard = async function(pid,aid) { navPush({v:'wizard',pid,aid}); return _ow(pid,aid); };
    const _sl = showLanding;
    showLanding = function() { navPush({v:'landing'}); return _sl(); };
    const _odp = openDocPage;
    openDocPage = function(key) { navPush({v:'doc',pid:currentProject?.id,key}); return _odp(key); };

    // Boot
    // =======================================================================
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <!-- Fallback: load static data if not using API -->
  <script>
    if (!location.port || location.port !== '8000') {
      const s = document.createElement('script');
      s.src = 'dashboard-data.js';
      s.onerror = () => console.log('No dashboard-data.js found (expected when using API server)');
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
