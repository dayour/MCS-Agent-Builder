<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Agent Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    /* ============ Theme variables ============ */
    :root {
      --bg: #f8fafc; --bg-s: #ffffff; --bg-s2: #f1f5f9; --bg-s3: #e2e8f0;
      --border: #e2e8f0; --border-s: #f1f5f9;
      --text: #0f172a; --text-s: #334155; --text-m: #64748b; --text-f: #94a3b8;
      --accent: #6366f1; --accent-h: #818cf8; --accent-bg: #eef2ff;
      --sidebar-bg: #ffffff; --sidebar-text: #0f172a; --sidebar-border: #e2e8f0; --sidebar-hover: rgba(0,0,0,0.04); --sidebar-muted: #64748b; --sidebar-faint: #94a3b8; --sidebar-icon-bg: #f1f5f9; --sidebar-icon: #64748b; --sidebar-section-border: #f1f5f9;
      --green: #10b981; --amber: #f59e0b; --red: #ef4444; --orange: #f97316;
    }
    [data-theme="dark"] {
      --bg: #09090b; --bg-s: #111113; --bg-s2: #18181b; --bg-s3: #27272a;
      --border: #27272a; --border-s: #1e1e22;
      --text: #fafafa; --text-s: #a1a1aa; --text-m: #71717a; --text-f: #52525b;
      --accent: #818cf8; --accent-h: #a5b4fc; --accent-bg: rgba(99,102,241,0.12);
      --sidebar-bg: #111113; --sidebar-text: #fafafa; --sidebar-border: #27272a; --sidebar-hover: rgba(255,255,255,0.06); --sidebar-muted: #a1a1aa; --sidebar-faint: #52525b; --sidebar-icon-bg: rgba(255,255,255,0.08); --sidebar-icon: #a1a1aa; --sidebar-section-border: #1e1e22;
    }

    /* ============ Base ============ */
    body { background: var(--bg); color: var(--text); }
    ::selection { background: var(--accent); color: white; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-s3); border-radius: 3px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }

    /* ============ Sidebar ============ */
    .sidebar { background: var(--sidebar-bg); color: var(--sidebar-text); border-right: 2px solid var(--sidebar-border); box-sizing: border-box; }
    .sidebar-item { transition: all 0.15s ease; border-radius: 0.5rem; }
    .sidebar-item:hover { background: var(--sidebar-hover); }

    /* ============ Surfaces ============ */
    .surface { background: var(--bg-s); border: 1px solid var(--border); border-radius: 0.75rem; }
    .surface:hover { border-color: var(--bg-s3); }
    .surface-flat { background: var(--bg-s); border-bottom: 2px solid var(--border); }

    /* ============ Project cards ============ */
    .project-card { background: var(--bg-s); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem 1.5rem; cursor: pointer; transition: all 0.2s; }
    .project-card:hover { border-color: var(--accent); background: var(--accent-bg); }

    /* ============ Agent rows ============ */
    .agent-row { transition: all 0.15s ease; cursor: pointer; border-radius: 0.5rem; }
    .agent-row:hover { background: var(--bg-s2); }

    /* ============ Brief cards ============ */
    .brief-card { background: var(--bg-s); border-radius: 0.75rem; border: 1px solid var(--border); transition: all 0.2s; overflow: hidden; position: relative; }
    .brief-card:hover { border-color: var(--bg-s3); }
    .brief-card-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border-s); }
    .brief-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; }
    .scenario-card { background: var(--bg-s2); border: 1px solid var(--border-s); border-radius: 0.625rem; padding: 0.875rem; transition: all 0.15s; }
    .scenario-card:hover { border-color: var(--border); }
    .eval-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 0.75rem; padding: 0.625rem 0; border-bottom: 1px solid var(--border-s); align-items: start; }
    .eval-row:last-child { border-bottom: none; }
    .readiness-ring { width: 4.5rem; height: 4.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; position: relative; }
    .readiness-ring svg { transform: rotate(-90deg); }
    .glass-panel { background: var(--bg-s); backdrop-filter: blur(12px); border: 1px solid var(--border); }

    /* ============ Component pills ============ */
    .comp-pill { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.375rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 500; transition: all 0.15s; background: var(--bg-s2); color: var(--text-s); border: 1px solid var(--border); }
    .comp-pill:hover { border-color: var(--accent); }
    .comp-pill.mcp { border-left: 3px solid #818cf8; }
    .comp-pill.connector { border-left: 3px solid #60a5fa; }
    .comp-pill.topic { border-left: 3px solid #4ade80; }
    .comp-pill.flow { border-left: 3px solid #fb923c; }
    .comp-pill.ai-tool { border-left: 3px solid #c084fc; }

    /* ============ Upload ============ */
    .upload-zone { border: 2px dashed var(--border); border-radius: 0.75rem; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-bg); }

    /* ============ Prose (doc viewer) ============ */
    .prose h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem; color: var(--text); }
    .prose h2 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 0 0.625rem; color: var(--text-s); border-bottom: 1px solid var(--border); padding-bottom: 0.375rem; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-m); }
    .prose p { margin: 0.5rem 0; line-height: 1.65; color: var(--text-s); }
    .prose ul, .prose ol { margin: 0.5rem 0; padding-left: 1.5rem; color: var(--text-s); }
    .prose li { margin: 0.25rem 0; line-height: 1.55; }
    .prose strong { font-weight: 600; color: var(--text); }
    .prose code { background: var(--bg-s2); padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; color: var(--accent); }
    .prose pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    .prose pre code { background: none; color: inherit; padding: 0; }
    .prose table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
    .prose th { background: var(--bg-s2); padding: 0.5rem 0.75rem; text-align: left; font-weight: 600; color: var(--text-m); border: 1px solid var(--border); }
    .prose td { padding: 0.5rem 0.75rem; border: 1px solid var(--border); color: var(--text-s); vertical-align: top; }
    .prose blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 0.75rem 0; color: var(--text-m); font-style: italic; }
    .prose a { color: var(--accent); text-decoration: underline; }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    /* ============ Terminal panel ============ */
    .claude-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; background: #09090b; color: #e2e8f0; z-index: 25; transform: translateX(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.5); }
    .claude-panel.open { transform: translateX(0); }
    main.panel-open { margin-right: 520px; transition: margin-right 0.3s cubic-bezier(.4,0,.2,1); }
    #terminal-container { padding: 4px; flex: 1; min-height: 0; position: relative; }
    #terminal-container .xterm { height: 100% !important; }
    #terminal-container .xterm-screen { height: 100% !important; }
    #terminal-container .xterm-viewport { overflow-y: auto !important; }

    /* ============ Toast ============ */
    .toast-container { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; pointer-events: none; }
    .toast { pointer-events: auto; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-size: 0.8125rem; max-width: 28rem; text-align: center; box-shadow: 0 8px 24px -4px rgba(0,0,0,0.25); animation: fadeIn 0.2s ease-out; background: var(--bg-s); border: 1px solid var(--border); color: var(--text-s); }
    .toast-error { border-color: #f87171; color: #f87171; }
    .toast-success { border-color: #4ade80; color: #4ade80; }
    .toast-info { border-color: var(--accent); color: var(--accent); }

    /* ============ Theme-aware form elements ============ */
    input:not([type="file"]), textarea, select {
      background: var(--bg-s2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-f);
    }
    select option {
      background: var(--bg-s);
      color: var(--text);
    }
    input:not([type="file"]):focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    /* ============ Theme-aware semantic badges ============ */
    .badge-info { background: var(--accent-bg); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .badge-success { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
    .badge-warning { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
    .badge-danger { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
    .badge-violet { background: rgba(139,92,246,0.1); color: #a78bfa; border: 1px solid rgba(139,92,246,0.2); }
    .badge-blue { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
    .badge-cyan { background: rgba(6,182,212,0.1); color: #22d3ee; border: 1px solid rgba(6,182,212,0.2); }
    .badge-orange { background: rgba(249,115,22,0.1); color: var(--orange); border: 1px solid rgba(249,115,22,0.2); }

    /* ============ Misc ============ */
    .save-indicator { transition: opacity 0.3s; }
  </style>
</head>

<body class="font-sans min-h-screen" style="background:var(--bg);color:var(--text)">
  <div id="toast-container" class="toast-container"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar fixed left-0 top-0 bottom-0 w-56 flex flex-col z-20">
    <div class="px-4 h-12 flex items-center justify-between" style="border-bottom:2px solid var(--sidebar-border)">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:var(--sidebar-icon-bg)">
          <svg class="w-4 h-4" style="color:var(--sidebar-icon)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
        </div>
        <div class="font-semibold text-sm tracking-tight" style="color:var(--sidebar-text)">CAD Builder</div>
      </div>
      <button onclick="toggleTheme()" class="w-7 h-7 rounded-lg flex items-center justify-center transition-colors" style="color:var(--sidebar-faint)" onmouseover="this.style.background='var(--sidebar-hover)'" onmouseout="this.style.background=''" title="Toggle theme">
        <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
    <nav id="customer-nav" class="flex-1 overflow-y-auto px-2 pt-2 space-y-0.5"></nav>
    <div class="px-2 pb-3 pt-2 space-y-0.5" style="border-top:1px solid var(--sidebar-section-border)">
      <button onclick="sendTerminalCommand('/bug')" class="w-full text-left flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs transition-colors" style="color:var(--sidebar-muted);background:none;border:none;cursor:pointer;font:inherit" onmouseover="this.style.background='var(--sidebar-hover)'" onmouseout="this.style.background=''">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Report Bug
      </button>
      <button onclick="sendTerminalCommand('/suggest')" class="w-full text-left flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs transition-colors" style="color:var(--sidebar-muted);background:none;border:none;cursor:pointer;font:inherit" onmouseover="this.style.background='var(--sidebar-hover)'" onmouseout="this.style.background=''">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        Suggest Feature
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-56 min-h-screen">
    <header class="surface-flat px-8 h-12 flex items-center sticky top-0 z-10" style="backdrop-filter:blur(12px);background:color-mix(in srgb, var(--bg) 80%, transparent)">
      <div class="flex items-center justify-between w-full">
        <div id="breadcrumb" class="text-sm" style="color:var(--text-m)">
          <span class="font-medium" style="color:var(--text)">Projects</span>
        </div>
        <div id="save-indicator" class="save-indicator opacity-0 text-xs flex items-center gap-1" style="color:var(--green)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Saved
        </div>
      </div>
    </header>

    <div class="p-8">
      <!-- ============== LANDING VIEW ============== -->
      <div id="landing-view">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-lg font-semibold" style="color:var(--text)">Projects</h1>
          <button onclick="showNewProjectModal()" class="text-xs font-medium px-3.5 py-2 rounded-lg flex items-center gap-1.5 transition-colors" style="background:var(--accent);color:white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            New Project
          </button>
        </div>
        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </div>

      <!-- ============== PROJECT VIEW ============== -->
      <div id="project-view" class="hidden">
        <div id="project-content"></div>
      </div>

      <!-- ============== DOCUMENT VIEW ============== -->
      <div id="doc-view" class="hidden">
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-3">
            <button onclick="backFromDoc()" style="color:var(--text-f)" class="hover:opacity-70 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 id="doc-page-title" class="text-lg font-semibold" style="color:var(--text)">Document</h1>
          </div>
        </div>
        <div class="surface rounded-xl overflow-hidden">
          <div id="doc-page-content" class="p-8 max-h-[80vh] overflow-y-auto prose"></div>
        </div>
      </div>

      <!-- ============== BRIEF VIEW ============== -->
      <div id="wizard-view" class="hidden">
        <!-- Brief header -->
        <div class="flex items-end justify-between mb-6">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-wider mb-1" style="color:var(--accent)" id="wizard-subtitle">Architecture Brief</div>
            <h1 id="wizard-title" class="text-lg font-semibold" style="color:var(--text)">Agent Name</h1>
          </div>
          <div id="brief-actions" class="flex items-center gap-2"></div>
        </div>

        <!-- Two-column: brief + readiness panel -->
        <div class="flex gap-6">
          <div class="flex-1 min-w-0 space-y-5" id="brief-content"></div>
          <div class="w-72 shrink-0">
            <div class="sticky top-20 space-y-5">
              <div id="readiness-panel" class="glass-panel rounded-xl p-5"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ============== CLAUDE CODE TERMINAL PANEL ============== -->
  <div id="claude-panel" class="claude-panel">
    <div class="flex items-center justify-between px-4 py-2 shrink-0" style="border-bottom:1px solid #1e1e22">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <span class="text-xs font-semibold text-white/80 shrink-0">Claude Code</span>
        <div id="term-tabs" class="flex items-center gap-0.5 overflow-x-auto min-w-0 ml-2"></div>
        <button onclick="addTermTab()" class="text-white/30 hover:text-white transition-colors p-1 shrink-0" title="New session">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <span id="panel-status" class="text-[10px] mr-1" style="color:var(--green)"></span>
        <button onclick="toggleClaudePanel()" class="text-white/30 hover:text-white transition-colors p-1" title="Close">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="terminal-container" class="flex-1 overflow-hidden min-h-0" style="position:relative"></div>
  </div>

  <!-- Panel toggle button -->
  <button id="panel-toggle-btn" onclick="toggleClaudePanel()" class="fixed bottom-6 right-6 z-25 w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105" style="background:var(--accent);color:white" title="Open Claude Code">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
  </button>


  <!-- ============== NEW PROJECT MODAL ============== -->
  <div id="new-project-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center" style="background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)" onclick="if(event.target===this)hideNewProjectModal()">
    <div class="surface rounded-xl p-6 w-96 shadow-2xl">
      <h3 class="font-semibold text-lg mb-4" style="color:var(--text)">New Project</h3>
      <input id="new-project-name" type="text" placeholder="Customer or project name"
        class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 mb-4" style="background:var(--bg-s2);border:1px solid var(--border);color:var(--text);--tw-ring-color:var(--accent)">
      <div class="flex justify-end gap-2">
        <button onclick="hideNewProjectModal()" class="px-4 py-2 text-sm" style="color:var(--text-m)">Cancel</button>
        <button onclick="createProject()" class="px-4 py-2 text-sm font-medium rounded-lg" style="background:var(--accent);color:white">Create</button>
      </div>
    </div>
  </div>

  <script>
    // =======================================================================
    // Constants
    // =======================================================================
    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      const icon = document.getElementById('theme-icon');
      if (icon) icon.innerHTML = isDark
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
    }
    // Restore saved theme
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();

    function toast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 4000);
    }

    const STAGES = ['discovery','context','research','build','eval','deployed'];
    const STAGE_COLORS = {
      discovery:    { badge: 'badge-info',    dot: '#94a3b8', accent: '#64748b' },
      context:      { badge: 'badge-blue',    dot: '#60a5fa', accent: '#3b82f6' },
      research:     { badge: 'badge-violet',  dot: '#a78bfa', accent: '#8b5cf6' },
      build:        { badge: 'badge-orange',  dot: '#fb923c', accent: '#f97316' },
      eval:         { badge: 'badge-cyan',    dot: '#22d3ee', accent: '#06b6d4' },
      deployed:     { badge: 'badge-success', dot: '#4ade80', accent: '#22c55e' },
    };
    const STAGE_LABELS = {
      discovery:'Discovery', context:'Context', research:'Research',
      build:'Build', eval:'Eval', deployed:'Deployed'
    };
    const FILE_MAP_DISPLAY = {
      sdr_raw: 'sdr-raw.md', customer_context: 'customer-context.md',
    };

    // =======================================================================
    // State
    // =======================================================================
    let dashboardData = null;
    let currentProject = null;
    let wizardProjectId = null;
    let wizardAgentId = null;
    let wizardState = {};

    // Detect if running via API (FastAPI server) or static file
    const USE_API = !!location.port || location.search.includes('api=1');

    // =======================================================================
    // Init
    // =======================================================================
    async function init() {
      marked.setOptions({ breaks: true, gfm: true });

      if (USE_API) {
        try {
          dashboardData = await fetch('/api/projects').then(r => r.json());
        } catch (e) {
          console.error('API fetch failed, falling back to static data', e);
          if (typeof DASHBOARD_DATA !== 'undefined') {
            dashboardData = DASHBOARD_DATA;
          }
        }
      } else {
        // Static mode — load from dashboard-data.js
        if (typeof DASHBOARD_DATA !== 'undefined') {
          dashboardData = DASHBOARD_DATA;
        }
      }

      if (!dashboardData || !dashboardData.projects) {
        document.getElementById('landing-view').innerHTML = `
          <div class="text-center py-20">
            <div class="text-6xl mb-4">&#128230;</div>
            <h2 class="text-xl font-semibold mb-2" style="color:var(--text)">No data yet</h2>
            <p style="color:var(--text-m)">Run <code style="background:var(--bg-s2);color:var(--accent)" class="px-2 py-1 rounded text-sm">python app/server.py</code> to start the server.</p>
          </div>`;
        return;
      }

      renderSidebar();
      renderLanding();

      // Auto-open Claude Code panel
      setTimeout(() => toggleClaudePanel(), 300);
    }

    // Sidebar
    // =======================================================================

        const p = currentProject;
        const agents = p.agents || [];
        const docs = p.docs || [];

        nav.innerHTML = `

            <button onclick="showLanding()" class="flex items-center gap-1.5 text-xs mb-2 transition-colors" style="color:var(--sidebar-faint)">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
              Projects

    function humanizeName(id) {
      return id.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      dashboardData.projects.forEach(p => {
        const el = document.getElementById(`nav-${p.id}`);
        if (!el) return;
        const match = !q || p.name.toLowerCase().includes(q) ||
          (p.agents || []).some(a => a.name.toLowerCase().includes(q));
        el.style.display = match ? '' : 'none';
      });
      document.querySelectorAll('[data-project-card]').forEach(card => {
        const id = card.dataset.projectCard;
        const p = dashboardData.projects.find(x => x.id === id);
        if (!p) return;

          (p.agents || []).some(a => a.name.toLowerCase().includes(q));
        card.style.display = match ? '' : 'none';
      });
    }

    // =======================================================================
    // Landing view
    // =======================================================================
    function renderLanding() {
      const data = dashboardData;

      document.getElementById('project-grid').innerHTML = data.projects.map(p => {
        const agentCount = (p.agents || []).length;

    // =======================================================================
    // Project detail view
    // =======================================================================
    async function selectProject(id) {
      if (USE_API) {
        try {
          currentProject = await fetch(`/api/projects/${id}`).then(r => r.json());
        } catch {
          currentProject = dashboardData.projects.find(p => p.id === id);
        }
      } else {
        currentProject = dashboardData.projects.find(p => p.id === id);
      }
      if (!currentProject) return;

      // Re-render sidebar for single-project mode
      renderSidebar();

      document.getElementById('breadcrumb').innerHTML = `
        <button onclick="showLanding()" style="color:var(--accent)" class="font-medium">Projects</button>
        <span class="mx-2" style="color:var(--text-f)">/</span>
        <span class="font-medium" style="color:var(--text)">${currentProject.name}</span>

      document.getElementById('project-view').classList.add('fade-in');

      renderProjectView();

      document.getElementById('doc-view').classList.add('hidden');

        <div class="flex items-center justify-between mb-6">
          <div>

              <span style="color:var(--border)">·</span>

              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>

              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="openWizard('${p.id}','${a.id}')" class="text-[11px] font-medium px-3 py-1.5 rounded-md transition-colors" style="color:var(--accent);background:var(--accent-bg)">Design</button>
                <button onclick="triggerBuildForAgent('${p.id}','${a.id}','${a.name.replace(/'/g, "\\'")}')" class="text-[11px] font-medium px-3 py-1.5 rounded-md transition-colors ${a.build_ready ? '' : 'opacity-30 cursor-not-allowed'}" style="${a.build_ready ? 'color:var(--green);background:rgba(16,185,129,0.1)' : 'color:var(--text-f)'}" ${a.build_ready ? '' : 'disabled'}>Build</button>
                <button onclick="deleteAgent('${p.id}','${a.id}','${a.name.replace(/'/g, "\\'")}')" class="p-1.5 rounded-md transition-colors hover:opacity-100 opacity-30" style="color:var(--red)" title="Delete">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

          ${docs.length ? docs.map(d => `
            <div class="flex items-center gap-3 px-4 py-2.5 agent-row" style="border-bottom:1px solid var(--border-s)">

              <button onclick="openDocPage('${d.key}')" class="text-xs flex-1 text-left truncate transition-colors" style="color:var(--text-s)" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-s)'">${d.filename}</button>
              <button onclick="deleteFile('${d.filename}')" class="p-1 rounded transition-colors opacity-30 hover:opacity-100" style="color:var(--red)" title="Delete">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

          `).join('') : ''}
            <!-- Upload section -->
            <div class="px-5 py-3 space-y-3" style="border-top:1px solid var(--border)">
              <!-- File drop/click zone -->
              <div class="upload-zone py-3" id="upload-zone"
                ondragover="event.preventDefault(); this.classList.add('dragover')"
                ondragleave="this.classList.remove('dragover')"
                ondrop="handleDrop(event)">
                <p class="text-xs" style="color:var(--text-f)">Drop files or <span style="color:var(--accent)" class="font-medium">click to upload</span></p>

              </div>
              <!-- Text paste area -->
              <div id="text-paste-area" class="hidden">
                <input id="paste-title" type="text" placeholder="Title (optional)" class="w-full rounded-lg px-3 py-1.5 text-xs mb-2 focus:outline-none">
                <textarea id="paste-text" rows="4" placeholder="Paste or type context here... meeting notes, email threads, requirements, etc." class="w-full rounded-lg px-3 py-2 text-xs focus:outline-none resize-y"></textarea>
                <div class="flex justify-end gap-2 mt-1.5">
                  <button onclick="toggleTextPaste()" class="text-xs px-3 py-1" style="color:var(--text-m)">Cancel</button>

                  Paste text context
                </button>
                <span class="text-[10px]" style="color:var(--text-f)">or paste an image anywhere on this page (Ctrl+V)</span>

    }

    // --- Full-page document viewer ---

    function openDocPage(key) {
      const content = (currentProject?.doc_content || {})[key];
      const docs = currentProject?.docs || [];
      const doc = docs.find(d => d.key === key);
      document.getElementById('doc-page-title').textContent = doc?.filename || FILE_MAP_DISPLAY[key] || key.replace(/_/g, ' ');
      const body = document.getElementById('doc-page-content');

      if (key === 'evals_csv' && content) {
        const lines = content.trim().split('\n');
        if (lines.length >= 2) {
          const parseRow = (l) => { const f=[]; let c='',q=false; for(let i=0;i<l.length;i++){const ch=l[i]; if(ch==='"'){q=!q;continue;} if(ch===','&&!q){f.push(c.trim());c='';continue;} c+=ch;} f.push(c.trim()); return f; };
          const h = parseRow(lines[0]), r = lines.slice(1).map(parseRow);
          body.innerHTML = `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(c=>`<td>${(c||'').substring(0,150)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        }
      } else if (content) {
        body.innerHTML = marked.parse(content);
      } else {
        body.innerHTML = '<p style="color:var(--text-f)">No content available</p>';
      }

      // Hide all views, show doc view
      document.getElementById('landing-view').classList.add('hidden');
      document.getElementById('project-view').classList.add('hidden');
      document.getElementById('wizard-view').classList.add('hidden');
      document.getElementById('doc-view').classList.remove('hidden');
      document.getElementById('doc-view').classList.add('fade-in');

      document.getElementById('breadcrumb').innerHTML = `
        <button onclick="showLanding()" style="color:var(--accent)" class="font-medium">Projects</button>
        <span class="mx-2" style="color:var(--text-f)">/</span>
        <button onclick="showProjectView()" style="color:var(--accent)" class="font-medium">${currentProject.name}</button>
        <span class="mx-2" style="color:var(--text-f)">/</span>
        <span class="font-medium" style="color:var(--text)">${FILE_MAP_DISPLAY[key] || key}</span>
      `;
      window.scrollTo({ top: 0 });
    }

    function backFromDoc() {
      document.getElementById('doc-view').classList.add('hidden');
      showProjectView();
    }

    function showProjectView() {
      if (!currentProject) { showLanding(); return; }
      document.getElementById('landing-view').classList.add('hidden');
      document.getElementById('wizard-view').classList.add('hidden');
      document.getElementById('doc-view').classList.add('hidden');
      document.getElementById('project-view').classList.remove('hidden');
      document.getElementById('breadcrumb').innerHTML = `
        <button onclick="showLanding()" style="color:var(--accent)" class="font-medium">Projects</button>
        <span class="mx-2" style="color:var(--text-f)">/</span>
        <span class="font-medium" style="color:var(--text)">${currentProject.name}</span>
      `;
      renderProjectView();
    }

    // --- File upload ---

    // Click-to-upload via event delegation (works regardless of innerHTML re-renders)
    document.addEventListener('click', (e) => {
      const zone = e.target.closest('#upload-zone');
      if (!zone) return;
      // Create a fresh file input every time — guaranteed to work
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = '.md,.txt,.csv,.docx,.pdf,.json,.pptx,.xlsx,.xls,.html,.htm,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.zip,.epub';
      input.style.display = 'none';
      document.body.appendChild(input);
      input.addEventListener('change', () => {
        handleFileSelect(input.files);
        input.remove();
      });
      input.click();
    });

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files);
    }

    async function handleFileSelect(files) {
      if (!USE_API || !currentProject) { toast('Upload requires the API server.', 'error'); return; }
      const status = document.getElementById('upload-status');

      for (const file of files) {
        const item = document.createElement('div');
        item.className = 'flex items-center gap-2 text-xs';
        item.style.color = 'var(--text-m)';
        item.innerHTML = `<svg class="w-3.5 h-3.5 spinner" style="color:var(--accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Uploading ${file.name}...`;
        status.appendChild(item);

        try {
          const form = new FormData();
          form.append('file', file);
          const res = await fetch(`/api/projects/${currentProject.id}/upload`, { method: 'POST', body: form });
          const result = await res.json();
          if (result.uploaded) {
            const converted = result.converted ? `<span style="color:var(--text-f)" class="ml-1">&rarr; ${result.converted}</span>` : '';
            const warn = result.conversion_error ? `<span style="color:var(--amber)" class="ml-1">(${result.conversion_error})</span>` : '';
            item.innerHTML = `<svg class="w-3.5 h-3.5" style="color:var(--green)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> <span style="color:var(--green)">${result.filename}</span>${converted}${warn}`;
          } else {
            item.innerHTML = `<svg class="w-3.5 h-3.5" style="color:var(--red)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg> <span style="color:var(--red)">Failed: ${result.error || 'Unknown error'}</span>`;
          }
        } catch (e) {
          item.innerHTML = `<svg class="w-3.5 h-3.5" style="color:var(--red)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg> <span style="color:var(--red)">Failed: ${e.message}</span>`;
        }
      }

      // Refresh project data to show new files
      setTimeout(async () => {
        try {
          currentProject = await fetch(`/api/projects/${currentProject.id}`).then(r => r.json());
          renderProjectView();
          renderSidebar();
        } catch {}
      }, 500);
    }

    // --- Text paste ---

    function toggleTextPaste() {
      const area = document.getElementById('text-paste-area');
      const toggle = document.getElementById('text-paste-toggle');
      const showing = !area.classList.contains('hidden');
      area.classList.toggle('hidden', showing);
      toggle.classList.toggle('hidden', !showing);
      if (!showing) document.getElementById('paste-text')?.focus();
    }

    async function submitPastedText() {
      if (!USE_API || !currentProject) return;
      const text = document.getElementById('paste-text').value.trim();
      const title = document.getElementById('paste-title').value.trim() || 'pasted-context';
      if (!text) { toast('No text to save', 'error'); return; }

      try {
        const res = await fetch(`/api/projects/${currentProject.id}/paste`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, title }),
        });
        const result = await res.json();
        if (result.saved) {
          document.getElementById('paste-text').value = '';
          document.getElementById('paste-title').value = '';
          toggleTextPaste();
          toast('Saved as ' + result.filename, 'success');
          currentProject = await fetch(`/api/projects/${currentProject.id}`).then(r => r.json());
          renderProjectView();
          renderSidebar();
        }
      } catch (e) {
        toast('Save failed: ' + e.message, 'error');
      }
    }

    // --- Clipboard image paste (Ctrl+V anywhere on page) ---

    document.addEventListener('paste', async (e) => {
      if (!USE_API || !currentProject) return;
      // Only handle if we're on the project view
      if (document.getElementById('project-view').classList.contains('hidden')) return;

      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (!blob) continue;

          const ext = item.type.split('/')[1] || 'png';
          const name = `pasted-image-${Date.now()}.${ext}`;
          const file = new File([blob], name, { type: item.type });

          const status = document.getElementById('upload-status');
          const el = document.createElement('div');
          el.className = 'flex items-center gap-2 text-xs';
          el.style.color = 'var(--text-m)';
          el.innerHTML = `<svg class="w-3.5 h-3.5 spinner" style="color:var(--accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Processing pasted image...`;
          status?.appendChild(el);

          try {
            const form = new FormData();
            form.append('file', file);
            const res = await fetch(`/api/projects/${currentProject.id}/upload`, { method: 'POST', body: form });
            const result = await res.json();
            if (result.uploaded) {
              const converted = result.converted ? `<span style="color:var(--text-f)" class="ml-1">&rarr; ${result.converted}</span>` : '';
              const warn = result.conversion_error ? `<span style="color:var(--amber)" class="ml-1">(${result.conversion_error})</span>` : '';
              el.innerHTML = `<svg class="w-3.5 h-3.5" style="color:var(--green)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> <span style="color:var(--green)">${result.filename}</span>${converted}${warn}`;
            }
            currentProject = await fetch(`/api/projects/${currentProject.id}`).then(r => r.json());
            renderProjectView();
            renderSidebar();
          } catch (err) {
            el.innerHTML = `<svg class="w-3.5 h-3.5" style="color:var(--red)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg> <span style="color:var(--red)">Failed: ${err.message}</span>`;
          }
        }
      }
    });

    // --- Research project docs: identify agents + full enrichment ---

    async function researchProject() {
      if (!USE_API || !currentProject) return;

      const id = currentProject.id;
      const cmd = `/mcs-research ${id}`;

      sendTerminalCommand(cmd, {
        projectId: id,
        onRefresh: (proj) => {

    // --- Delete agent ---

    async function deleteAgent(projectId, agentId, agentName) {
      if (!USE_API) return;
      if (!confirm(`Delete "${agentName}" and all its files (spec, evals, briefs)?`)) return;
      try {
        const res = await fetch(`/api/projects/${projectId}/agents/${agentId}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.deleted) {
          toast('Agent deleted', 'success');
          currentProject = await fetch(`/api/projects/${projectId}`).then(r => r.json());
          renderProjectView();
          renderSidebar();
        }
      } catch (e) {
        toast('Delete failed: ' + e.message, 'error');
      }
    }

    // --- Delete file ---

    async function deleteFile(filename) {
      if (!USE_API || !currentProject) return;
      if (!confirm(`Delete ${filename}?`)) return;

      try {
        const res = await fetch(`/api/projects/${currentProject.id}/docs/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.deleted) {
          // Refresh
          currentProject = await fetch(`/api/projects/${currentProject.id}`).then(r => r.json());
          renderProjectView();
          renderSidebar();

    // New project modal
    // =======================================================================

      document.getElementById('new-project-modal').classList.remove('hidden');
      document.getElementById('new-project-name').focus();
    }
    function hideNewProjectModal() {
      document.getElementById('new-project-modal').classList.add('hidden');

    // =======================================================================
    // WIZARD
    // =======================================================================

    async function openWizard(projectId, agentId) {
      wizardProjectId = projectId;
      wizardAgentId = agentId;

      const projName = dashboardData.projects.find(p => p.id === projectId)?.name || projectId;
      const agentName = currentProject?.agents?.find(a => a.id === agentId)?.name || humanizeName(agentId);

      // Switch view
      document.getElementById('landing-view').classList.add('hidden');
      document.getElementById('project-view').classList.add('hidden');
      document.getElementById('wizard-view').classList.remove('hidden');
      document.getElementById('wizard-view').classList.add('fade-in');

      document.getElementById('wizard-title').textContent = `${agentName || projName}`;

      document.getElementById('breadcrumb').innerHTML = `
        <button onclick="showLanding()" style="color:var(--accent)" class="font-medium">Projects</button>

      // Load existing agent brief from API
      if (USE_API) {
        try {

          wizardState = agentData.brief || { project_id: projectId, agent_id: agentId };
        } catch {
          wizardState = { project_id: projectId, agent_id: agentId };
        }
      } else {
        wizardState = { project_id: projectId, agent_id: agentId };
      }

      // Ensure agent name is set (v2 schema)
      if (agentName && !wizardState.agent?.name) {
        wizardState.agent = wizardState.agent || {};
        wizardState.agent.name = agentName;
      }

      // Just render what we have — empty/basic/complete states handled in renderBrief
      renderBrief();
