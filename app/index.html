    // (Mock data removed — Claude Code generates real data via terminal)

    // =======================================================================
    // Architecture Brief — renders AI-generated recommendations as a document
    // =======================================================================

    let briefEditSection = null; // which section is in edit mode (null = all view mode)

    function getBriefReadiness(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals) {
      // Categorize: empty → basic (doc-extracted) → enriched (researched)
      const hasBasic = !!(biz?.problemStatement || biz?.useCase);
      const hasComponents = (integ || []).filter(i => i.name).length > 0;
      const hasArchReason = !!(arch?.reason);
      const hasEvals = (evals || []).length >= 3;
      const hasScenarios = (scenarios || []).filter(s => s.userSays).length >= 3;
      const hasInstructions = !!(wizardState.instructions);

      if (!hasBasic) return 'empty';
      if (hasComponents && hasArchReason && hasEvals && hasScenarios && hasInstructions) return 'enriched';
      return 'basic';
    }

    function isBuildReady(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals, openQs) {
      const unanswered = (openQs || []).filter(q => q.question && !q.answer);
      const chanLen = (arch?.channels || []).filter(c => (typeof c === 'object' ? c.name : c)).length;
      return !!(biz?.problemStatement || biz?.useCase)
        && !!(arch?.type)
        && !!(wizardState.instructions)
        && ((integ || []).filter(i => i.name).length + (convos?.topics || []).length) > 0
        && (know || []).filter(k => k.name).length > 0
        && (scenarios || []).filter(s => s.userSays).length >= 3
        && (evals || []).length > 0
        && !!(bounds?.handle?.length || bounds?.decline?.length || bounds?.refuse?.length)
        && chanLen > 0
        && unanswered.length === 0;
    }

    function renderBrief() {
      const biz = wizardState.business || {};
      const agent = wizardState.agent || {};
      const caps = wizardState.capabilities || [];
      const integ = wizardState.integrations || [];
      const know = wizardState.knowledge || [];
      const convos = wizardState.conversations || {};
      const bounds = wizardState.boundaries || {};
      const arch = wizardState.architecture || {};
      const scenarios = wizardState.scenarios || [];
      const evals = wizardState.evals || [];
      const openQs = wizardState.openQuestions || [];

      const readiness = getBriefReadiness(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals);

      // === EMPTY: no data at all ===
      if (readiness === 'empty') {
        document.getElementById('brief-content').innerHTML = `
          <div class="brief-card relative p-8 text-center">
            <div class="text-4xl mb-4 opacity-40">&#128221;</div>
            <h3 class="text-lg font-semibold mb-2" style="color:var(--text)">No brief yet</h3>
            <p class="text-sm mb-4" style="color:var(--text-m)">This agent hasn't been researched yet. Go back to the project and run <strong>Research</strong> to identify agents and generate specs from your documents.</p>
            <p class="text-xs mt-3" style="color:var(--text-f)">Or type directly in the Claude Code terminal panel</p>
          </div>`;
        document.getElementById('readiness-panel').innerHTML = '';
        return;
      }

      // === BASIC or ENRICHED: show brief cards ===
      let researchBanner = '';
      if (readiness === 'basic') {
        researchBanner = `
          <div class="rounded-xl px-5 py-3 mb-5 flex items-center gap-3" style="background:var(--bg-s2);border:1px solid var(--border)">
            <svg class="w-5 h-5 shrink-0" style="color:var(--accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-xs" style="color:var(--text-m)">Basic info extracted from documents. Click <strong>Research</strong> above to have Claude deep-dive MCS components, score architecture, and generate scenarios + evals.</p>
          </div>`;
      }

      document.getElementById('brief-content').innerHTML = researchBanner + [
        bCard('business', '#6366f1', 'Business Context', briefBusinessV(biz), briefBusinessE(biz)),
        bCard('agent', '#8b5cf6', 'Agent Identity', briefAgentV(agent), briefAgentE(agent)),
        bCard('capabilities', '#f59e0b', 'Capabilities', briefCapsV(caps), briefCapsE(caps)),
        bCard('integrations', '#3b82f6', 'Integrations', briefIntegV(integ), briefIntegE(integ)),
        bCard('knowledge', '#10b981', 'Knowledge Sources', briefKnowledgeV(know), briefKnowledgeE(know)),
        bCard('conversations', '#06b6d4', 'Conversation Topics', briefConvosV(convos), briefConvosE(convos)),
        bCard('boundaries', '#ef4444', 'Scope & Boundaries', briefBoundariesV(bounds), briefBoundariesE(bounds)),
        bCard('architecture', '#8b5cf6', 'Architecture', briefArchV(arch), briefArchE(arch)),
        bCard('scenarios', '#f59e0b', 'Scenarios', briefScenariosV(scenarios), briefScenariosE(scenarios)),
        bCard('evals', '#06b6d4', 'Evaluation Tests', briefEvalsV(evals), briefEvalsE(evals)),
        bCard('questions', '#f97316', 'Open Questions', briefQuestionsV(openQs), briefQuestionsE(openQs)),
      ].join('');

      renderReadinessPanel(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals, openQs);

      // Show action buttons in header — Build only when all 10 pre-build checks pass
      const actionsEl = document.getElementById('brief-actions');
      if (actionsEl && readiness !== 'empty') {
        const buildEnabled = isBuildReady(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals, openQs);
        const isPublished = (wizardState.buildStatus || {}).status === 'published';
        actionsEl.innerHTML = `
          <button onclick="researchAndEnrich()" class="px-4 py-2 text-xs font-medium rounded-lg transition-all flex items-center gap-1.5" style="color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)" onmouseover="this.style.background='var(--accent-bg)'" onmouseout="this.style.background=''">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Re-research
          </button>
          ${buildEnabled
            ? `<button onclick="triggerBuild()" class="px-5 py-2.5 text-sm font-semibold rounded-xl transition-all flex items-center gap-2" style="background:var(--accent);color:white;box-shadow:0 4px 14px -2px color-mix(in srgb, var(--accent) 40%, transparent)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Build Agent
              </button>`
            : `<button disabled title="Run Research first" class="px-5 py-2.5 text-sm font-semibold rounded-xl cursor-not-allowed flex items-center gap-2" style="color:var(--text-f);background:var(--bg-s3)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Build Agent
              </button>`
          }
          ${isPublished
            ? `<button onclick="triggerEval()" class="px-4 py-2 text-xs font-medium rounded-lg transition-all flex items-center gap-1.5" style="color:var(--green);border:1px solid color-mix(in srgb, var(--green) 30%, transparent)" onmouseover="this.style.background='rgba(16,185,129,0.1)'" onmouseout="this.style.background=''">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Evaluate
              </button>`
            : ''
          }
          ${readiness !== 'empty'
            ? `<button onclick="exportReport()" class="px-4 py-2 text-xs font-medium rounded-lg transition-all flex items-center gap-1.5" style="color:var(--text-m);border:1px solid var(--border)" onmouseover="this.style.background='var(--bg-s)'" onmouseout="this.style.background=''">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Export PDF
              </button>`
            : ''
          }`;
      } else if (actionsEl) {
        actionsEl.innerHTML = '';
      }
    }

    function researchAndEnrich() {
      if (!wizardProjectId || !wizardAgentId) return;
      const cmd = `/mcs-research ${wizardProjectId} ${wizardAgentId}`;
      sendTerminalCommand(cmd, {
        projectId: wizardProjectId,
        onRefresh: async () => {
          try {
            const agentData = await fetch(`/api/projects/${wizardProjectId}/agents/${wizardAgentId}`).then(r => r.json());
            if (agentData.brief) {
              wizardState = agentData.brief;
              renderBrief();
            }
          } catch {}
        }
      });
    }

    function bCard(id, accent, title, viewContent, editContent) {
      const editing = briefEditSection === id;
      return `
        <div class="brief-card relative" id="section-${id}">
          <div class="brief-accent" style="background:${accent}"></div>
          <div class="brief-card-header">
            <h3 class="font-semibold text-sm pl-2" style="color:var(--text)">${title}</h3>
            ${editing
              ? `<button onclick="saveBriefSection('${id}')" class="text-xs font-medium transition-colors flex items-center gap-1" style="color:var(--green)">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>Done</button>`
              : `<button onclick="editBriefSection('${id}')" class="text-xs transition-colors flex items-center gap-1" style="color:var(--text-f)" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-f)'">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Edit</button>`
            }
          </div>
          <div class="p-5">${editing ? editContent : viewContent}</div>
        </div>`;
    }

    function editBriefSection(id) {
      if (briefEditSection && briefEditSection !== id) saveBriefSection(briefEditSection);
      briefEditSection = id;
      renderBrief();
      const section = document.getElementById(`section-${id}`);
      const first = section?.querySelector('input, textarea, select');
      if (first) setTimeout(() => first.focus(), 50);
      // Auto-grow all textareas to fit content
      setTimeout(() => {
        section?.querySelectorAll('textarea').forEach(ta => { if (ta.value) autoGrow(ta); });
      }, 60);
    }

    function saveBriefSection(id) {
      collectBriefEdit(id);
      briefEditSection = null;
      renderBrief();
      saveBriefState();
    }

    // ---- View renderers (v2 schema) ----

    function briefBusinessV(biz) {
      const ps = biz.problemStatement || biz.useCase || '';
      let html = `<p class="text-sm leading-relaxed" style="color:var(--text-s)">${ps || '<span style="color:var(--text-f)" class="italic">No problem statement</span>'}</p>`;
      const challenges = (biz.challenges || []).filter(c => c.challenge);
      if (challenges.length) {
        html += `<div class="mt-3"><span class="text-[10px] font-bold uppercase" style="color:var(--text-f)">Challenges</span><div class="mt-1 space-y-1">${challenges.map(c => `<div class="flex items-center gap-2"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${c.impact==='high'?'badge-danger':c.impact==='medium'?'badge-warning':'badge-info'}">${c.impact||'medium'}</span><span class="text-xs" style="color:var(--text-s)">${c.challenge}</span></div>`).join('')}</div></div>`;
      }
      const benefits = (biz.benefits || []).filter(b => b.benefit);
      if (benefits.length) {
        html += `<div class="mt-3"><span class="text-[10px] font-bold uppercase" style="color:var(--text-f)">Benefits</span><div class="mt-1 space-y-1">${benefits.map(b => `<div class="flex items-center gap-2"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded badge-success">${b.type||'efficiency'}</span><span class="text-xs" style="color:var(--text-s)">${b.benefit}</span></div>`).join('')}</div></div>`;
      }
      return html;
    }

    function briefAgentV(agent) {
      let html = `<p class="text-sm leading-relaxed" style="color:var(--text-s)">${agent.description || '<span style="color:var(--text-f)" class="italic">No agent description — this is what appears in Copilot Studio</span>'}</p>`;
      if (agent.persona) html += `<div class="mt-2 text-xs" style="color:var(--text-m)"><span class="font-semibold">Persona:</span> ${agent.persona}</div>`;
      if (agent.responseFormat) html += `<div class="text-xs" style="color:var(--text-m)"><span class="font-semibold">Format:</span> ${agent.responseFormat}</div>`;
      if (agent.primaryUsers) html += `<div class="text-xs" style="color:var(--text-m)"><span class="font-semibold">Users:</span> ${agent.primaryUsers}</div>`;
      return html;
    }

    function briefCapsV(caps) {
      if (!caps.length) return '<p class="text-sm italic" style="color:var(--text-f)">No capabilities defined</p>';
      const mvp = caps.filter(c => c.phase !== 'future');
      const future = caps.filter(c => c.phase === 'future');
      let html = '';
      if (mvp.length) {
        html += `<div class="space-y-1.5">${mvp.map(c => `<div class="flex items-center gap-2"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded badge-success">MVP</span><span class="text-sm font-medium" style="color:var(--text)">${c.name}</span></div>`).join('')}</div>`;
      }
      if (future.length) {
        html += `<div class="mt-3 pt-2" style="border-top:1px solid var(--border-s)"><span class="text-[10px] font-bold uppercase" style="color:var(--text-f)">Future</span><div class="mt-1.5 space-y-1.5">${future.map(c => `<div class="flex items-center gap-2"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded badge-violet">FUTURE</span><span class="text-sm" style="color:var(--text-m)">${c.name}</span>${c.reason ? `<span class="text-xs" style="color:var(--text-f)">— ${c.reason}</span>` : ''}</div>`).join('')}</div></div>`;
      }
      return html;
    }

    function briefIntegV(integ) {
      if (!integ.filter(i => i.name).length) return '<p class="text-sm italic" style="color:var(--text-f)">No integrations configured</p>';
      return `<div class="flex flex-wrap gap-2">${integ.filter(i => i.name).map(i => `
        <div class="comp-pill ${i.type}" title="${esc(i.purpose)}${i.dataProvided ? '\\nData: ' + esc(i.dataProvided) : ''}">
          <span class="text-[10px] font-bold uppercase opacity-60">${i.type}</span>
          <span class="font-medium">${i.name}</span>
          ${i.phase === 'future' ? '<span class="text-[9px] px-1 rounded badge-violet">future</span>' : ''}
        </div>
      `).join('')}</div>`;
    }

    function briefKnowledgeV(know) {
      const knowledge = (know || []).filter(k => k.name);
      if (!knowledge.length) return '<p class="text-sm italic" style="color:var(--text-f)">No knowledge sources</p>';
      return `<div class="flex flex-wrap gap-2">${knowledge.map(k => `
        <div class="comp-pill badge-success" style="border-left:3px solid var(--green)">
          <span class="text-[10px] font-bold uppercase opacity-60">${(k.type || '').split(' ')[0]}</span>
          <span class="font-medium">${k.name}</span>
          ${k.purpose ? '<span class="text-[10px] ml-1" style="color:var(--text-f)">— ' + k.purpose + '</span>' : ''}
        </div>
      `).join('')}</div>`;
    }

    function briefConvosV(convos) {
      const topics = (convos.topics || []).filter(t => t.name);
      if (!topics.length) return '<p class="text-sm italic" style="color:var(--text-f)">No conversation topics</p>';
      return `<div class="space-y-1.5">${topics.map(t => `
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${t.topicType === 'system' ? 'badge-info' : t.topicType === 'generative' ? 'badge-violet' : 'badge-cyan'}">${t.topicType || 'custom'}</span>
          <span class="text-sm font-medium" style="color:var(--text)">${t.name}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded" style="background:var(--bg-s2);color:var(--text-f)">${t.triggerType || 'agent-chooses'}</span>
          ${t.phase === 'future' ? '<span class="text-[9px] px-1 rounded badge-violet">future</span>' : ''}
          ${t.description ? '<span class="text-xs" style="color:var(--text-m)">— ' + t.description + '</span>' : ''}
        </div>
      `).join('')}</div>`;
    }

    function briefScenariosV(scenarios) {
      const filtered = (scenarios || []).filter(s => s.userSays);
      if (!filtered.length) return '<p class="text-sm italic" style="color:var(--text-f)">No scenarios defined</p>';
      return `<div class="space-y-2">${filtered.map((sc, i) => `
        <div class="scenario-card">
          <div class="flex items-start gap-3">
            <span class="flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold shrink-0 badge-warning">${i+1}</span>
            <div class="min-w-0">
              <p class="text-sm font-medium" style="color:var(--text)">"${sc.userSays}"</p>
              <p class="text-xs mt-1" style="color:var(--text-m)">${sc.agentDoes || sc.agentShould || ''}</p>
              ${sc.category ? '<span class="text-[9px] px-1.5 py-0.5 rounded" style="background:var(--bg-s2);color:var(--text-f)">' + sc.category + '</span>' : ''}
            </div>
          </div>
        </div>
      `).join('')}</div>`;
    }

    function briefEvalsV(evals) {
      const er = wizardState.evalResults || {};
      const hasResults = er.summary && er.summary.total > 0;

      if (!evals.length && !hasResults) return '<p class="text-sm italic" style="color:var(--text-f)">No evaluation tests defined</p>';

      let resultsHtml = '';
      if (hasResults) {
        const s = er.summary;
        const pct = parseInt(s.passRate) || 0;
        const rColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--amber)' : 'var(--red)';
        resultsHtml = `
          <div class="rounded-xl px-4 py-3 mb-4" style="background:var(--bg-s2);border:1px solid var(--border)">
            <div class="flex items-center gap-3 mb-2">
              <span class="text-xs font-bold px-2.5 py-1 rounded-lg" style="color:${rColor};background:color-mix(in srgb, ${rColor} 12%, transparent);border:1px solid color-mix(in srgb, ${rColor} 25%, transparent)">${s.passRate} pass rate</span>
              <span class="text-xs" style="color:var(--text-m)">${s.passed}/${s.total} passed</span>
              <span class="text-[10px]" style="color:var(--text-f)">via ${er.method || 'Direct Line'} — ${er.lastRun ? new Date(er.lastRun).toLocaleString() : ''}</span>
            </div>
            ${(er.results || []).filter(r => !r.pass).length > 0 ? `
              <div class="text-[10px] font-semibold uppercase mb-1" style="color:var(--red)">Failed</div>
              ${(er.results || []).filter(r => !r.pass).map(r => `
                <div class="text-xs mb-1" style="color:var(--text-s)"><span style="color:var(--text)">"${r.question}"</span> — expected "${r.expected}", got "${(r.actual || '').substring(0, 80)}${(r.actual || '').length > 80 ? '...' : ''}"</div>
              `).join('')}
            ` : ''}
          </div>`;
      }

      return `
        <p class="text-xs mb-3" style="color:var(--text-m)">Test cases that verify the agent responds correctly. Run after each build to catch regressions.</p>
        ${resultsHtml}
        <div class="eval-row text-[10px] font-semibold uppercase tracking-wide pb-2 mb-1" style="color:var(--text-f);border-bottom:1px solid var(--border)">
          <span>Question</span><span>Expected Response</span><span>Method</span><span>Pass</span>
        </div>
        ${evals.map(e => `
          <div class="eval-row">
            <span class="text-sm" style="color:var(--text)">${e.question}</span>
            <span class="text-sm" style="color:var(--text-s)">${e.expected}</span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full badge-cyan self-start">${e.method || 'Semantic'}</span>
            <span class="text-xs font-bold self-start" style="color:var(--text-m)">${e.score || '70'}%</span>
          </div>
        `).join('')}
        <div class="mt-3 pt-2 text-[10px]" style="border-top:1px solid var(--border-s);color:var(--text-f)">${evals.length} test${evals.length !== 1 ? 's' : ''} — Semantic matching compares meaning, not exact words</div>
      `;
    }

    function briefBoundariesV(bounds) {
      const handleList = Array.isArray(bounds.handle) ? bounds.handle.filter(Boolean) : (bounds.handle ? [bounds.handle] : []);
      const declineList = (bounds.decline || []).filter(d => d.topic || (typeof d === 'string' && d));
      const refuseList = (bounds.refuse || []).filter(r => r.topic || (typeof r === 'string' && r));
      if (!handleList.length && !declineList.length && !refuseList.length) {
        return '<p class="text-sm italic" style="color:var(--text-f)">No boundaries defined</p>';
      }
      let html = '';
      // Handle cards
      if (handleList.length) {
        html += `<div class="mb-4"><div class="text-[10px] font-bold uppercase tracking-wide mb-2" style="color:var(--green)">Handle — Topics the agent answers confidently</div>
          <div class="space-y-2">${handleList.map(h => `
            <div class="rounded-xl p-3" style="background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2)">
              <p class="text-sm" style="color:var(--text-s)">${h}</p>
            </div>`).join('')}</div></div>`;
      }
      // Decline cards
      if (declineList.length) {
        html += `<div class="mb-4"><div class="text-[10px] font-bold uppercase tracking-wide mb-2" style="color:var(--amber)">Decline — Politely redirect elsewhere</div>
          <div class="space-y-2">${declineList.map(d => {
            const topic = typeof d === 'object' ? d.topic : d;
            const redirect = typeof d === 'object' ? d.redirect : '';
            return `<div class="rounded-xl p-3" style="background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2)">
              <p class="text-sm font-medium" style="color:var(--text)">${topic}</p>
              ${redirect ? `<p class="text-xs mt-1" style="color:var(--amber)">&rarr; ${redirect}</p>` : ''}
            </div>`;
          }).join('')}</div></div>`;
      }
      // Refuse cards
      if (refuseList.length) {
        html += `<div><div class="text-[10px] font-bold uppercase tracking-wide mb-2" style="color:var(--red)">Refuse — Hard stops, never do these</div>
          <div class="space-y-2">${refuseList.map(r => {
            const topic = typeof r === 'object' ? r.topic : r;
            const reason = typeof r === 'object' ? r.reason : '';
            return `<div class="rounded-xl p-3" style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2)">
              <p class="text-sm font-medium" style="color:var(--text)">${topic}</p>
              ${reason ? `<p class="text-xs mt-1" style="color:var(--red)">${reason}</p>` : ''}
            </div>`;
          }).join('')}</div></div>`;
      }
      return html;
    }

    function briefArchV(arch) {
      const rec = arch.type || '';
      const badgeClass = { 'Single Agent': 'badge-info', 'Multi-Agent': 'badge-violet', 'Connected Agent': 'badge-blue' };
      const factors = arch.factors || {};
      const factorLabels = [
        ['domainSeparation', 'Different problem domains'],
        ['dataIsolation', 'Different data sources per capability'],
        ['teamOwnership', 'Different teams own different parts'],
        ['reusability', 'Specialists reusable by other agents'],
        ['instructionSize', 'Instructions would exceed 8000 chars'],
        ['knowledgeIsolation', 'Each capability needs its own knowledge'],
      ];
      const score = factorLabels.filter(([k]) => factors[k]).length;
      let html = '';
      if (rec) {
        html += `<div class="flex items-center gap-3 mb-3">
          <span class="text-xs font-bold px-3 py-1.5 rounded-lg ${badgeClass[rec] || 'badge-info'}">${rec}</span>
          <span class="text-xs font-bold tabular-nums" style="color:var(--text-m)">Score: ${score}/6</span>
          <span class="text-xs" style="color:var(--text-f)">${score <= 2 ? '(0-2 = Single Agent)' : '(3+ = Multi-Agent)'}</span>
        </div>`;
        if (factorLabels.some(([k]) => factors[k])) {
          html += `<div class="grid grid-cols-2 gap-x-4 gap-y-1 mb-3">${factorLabels.map(([k, label]) => `<div class="flex items-center gap-1.5 text-xs" style="color:${factors[k] ? 'var(--text-s)' : 'var(--text-f)'}">
            ${factors[k] ? '<svg class="w-3 h-3 shrink-0" style="color:var(--accent)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>' : '<svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>'}
            ${label}</div>`).join('')}</div>`;
        }
      } else {
        html += `<p class="text-sm italic mb-3" style="color:var(--text-f)">Run Research to get architecture recommendation</p>`;
      }
      const triggers = arch.triggers || [];
      const channels = arch.channels || [];
      html += `<div class="flex gap-8">
        <div class="flex-1"><span class="text-[10px] font-bold uppercase" style="color:var(--text-f)">Triggers</span>
          ${triggers.length ? `<div class="mt-1.5 space-y-1">${triggers.map(t => {
            const type = typeof t === 'object' ? t.type : t;
            const desc = typeof t === 'object' ? t.description : '';
            return `<div class="text-xs"><span class="font-semibold" style="color:var(--text-s)">${type}</span>${desc ? ` <span style="color:var(--text-f)">— ${desc}</span>` : ''}</div>`;
          }).join('')}</div>` : '<p class="text-xs italic mt-1" style="color:var(--text-f)">None selected</p>'}
        </div>
        <div class="flex-1"><span class="text-[10px] font-bold uppercase" style="color:var(--text-f)">Channels</span>
          ${channels.length ? `<div class="mt-1.5 space-y-1">${channels.map(c => {
            const name = typeof c === 'object' ? c.name : c;
            const reason = typeof c === 'object' ? c.reason : '';
            return `<div class="text-xs"><span class="font-semibold" style="color:var(--text-s)">${name}</span>${reason ? ` <span style="color:var(--text-f)">— ${reason}</span>` : ''}</div>`;
          }).join('')}</div>` : '<p class="text-xs italic mt-1" style="color:var(--text-f)">None selected</p>'}
        </div>
      </div>`;
      return html;
    }

    function nl2br(s) { return (s||'').replace(/\n/g, '<br>'); }

    function briefQuestionsV(openQs) {
      const open = openQs.filter(q => q.question && !q.answer);
      const answered = openQs.filter(q => q.question && q.answer);
      if (!openQs.length || !openQs.some(q => q.question)) return '<p class="text-sm italic" style="color:var(--text-f)">No open questions — all clear for build</p>';
      let html = '';
      if (open.length) {
        html += `<div class="space-y-3 mb-4">${open.map(q => `
          <div class="badge-orange rounded-xl p-3.5">
            <div class="flex items-start gap-2.5">
              <svg class="w-4 h-4 shrink-0 mt-0.5" style="color:var(--orange)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <p class="text-sm font-medium min-w-0" style="color:var(--text)">${nl2br(q.question)}</p>
            </div>
          </div>
        `).join('')}</div>`;
      }
      if (answered.length) {
        html += `<div class="space-y-2">${answered.map(q => `
          <div class="badge-success rounded-xl p-3.5">
            <p class="text-sm font-medium" style="color:var(--text)">${nl2br(q.question)}</p>
            <p class="text-sm mt-1.5" style="color:var(--green)">${nl2br(q.answer)}</p>
          </div>
        `).join('')}</div>`;
      }
      const openCount = open.length;
      const totalCount = openQs.filter(q => q.question).length;
      html += `<div class="mt-3 pt-2 text-[10px]" style="border-top:1px solid var(--border-s);color:var(--text-f)">${openCount} open / ${totalCount} total${openCount > 0 ? ' — resolve before building' : ' — all resolved'}</div>`;
      return html;
    }

    function briefQuestionsE(openQs) {
      const rows = openQs.length ? openQs : [{ question: '', answer: '' }];
      return `<div class="space-y-3">
        <p class="text-[11px]" style="color:var(--text-m)">Press <kbd style="background:var(--bg-s3);padding:1px 4px;border-radius:3px;font-size:10px">Enter</kbd> to save a question. <kbd style="background:var(--bg-s3);padding:1px 4px;border-radius:3px;font-size:10px">Shift+Enter</kbd> or <kbd style="background:var(--bg-s3);padding:1px 4px;border-radius:3px;font-size:10px">Ctrl+Enter</kbd> for new line.</p>
        ${rows.map((q, i) => `
          <div class="rounded-xl p-4 relative group" style="background:var(--bg-s2);border:1px solid var(--border-s)" id="oq-card-${i}">
            <button onclick="removeQuestionBrief(${i})" class="absolute top-2 right-2 p-1 rounded-md opacity-0 group-hover:opacity-60 hover:!opacity-100 transition-opacity" style="color:var(--red)" title="Remove">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="mb-2">
              <label class="block text-[10px] font-bold uppercase mb-1" style="color:var(--text-f)">Question</label>
              <textarea name="oq_q_${i}" rows="1" placeholder="What do we need to know?" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none resize-none" onkeydown="handleQSave(event, ${i})" oninput="autoGrow(this)">${esc(q.question)}</textarea>
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1" style="color:var(--green)">Answer <span class="font-normal normal-case" style="color:var(--text-f)">— fill in when resolved</span></label>
              <textarea name="oq_a_${i}" rows="1" placeholder="Leave empty until answered" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none resize-none" style="border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.05)" onkeydown="handleQSave(event, ${i})" oninput="autoGrow(this)">${esc(q.answer || '')}</textarea>
            </div>
          </div>
        `).join('')}
        <button onclick="addQuestionBrief()" class="text-xs font-medium flex items-center gap-1" style="color:var(--orange)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add question
        </button>
      </div>`;
    }

    // ---- Edit renderers (v2 schema) ----

    function briefBusinessE(biz) {
      return `<div class="space-y-3">
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Use Case (one-liner)</label>
          <input type="text" data-field="business.useCase" value="${esc(biz.useCase)}" placeholder="e.g. Automate order status inquiries for support team" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none"></div>
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Problem Statement</label>
          <textarea data-field="business.problemStatement" rows="3" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none" placeholder="2-3 sentences: what pain, for whom, why now">${esc(biz.problemStatement)}</textarea></div>
      </div>`;
    }

    function briefAgentE(agent) {
      return `<div class="space-y-3">
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Agent Name</label>
          <input type="text" data-field="agent.name" value="${esc(agent.name)}" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none"></div>
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Agent Description <span class="font-normal normal-case" style="color:var(--text-f)">— appears in Copilot Studio</span></label>
          <textarea data-field="agent.description" rows="3" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none" placeholder="e.g. An AI assistant that helps support staff check order status, track shipments, and resolve delivery issues by connecting to SAP and the support knowledge base.">${esc(agent.description)}</textarea></div>
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Persona / Tone</label>
          <input type="text" data-field="agent.persona" value="${esc(agent.persona)}" placeholder="e.g. Professional, concise, uses bullet points" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none"></div>
        <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Response Format</label>
          <input type="text" data-field="agent.responseFormat" value="${esc(agent.responseFormat)}" placeholder="e.g. Bullet points, max 3 items, tables for data" class="w-full rounded-lg px-3 py-2 text-sm focus:outline-none"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Primary Users</label>
            <input type="text" data-field="agent.primaryUsers" value="${esc(agent.primaryUsers)}" class="w-full rounded-lg px-3 py-1.5 text-sm focus:outline-none"></div>
          <div><label class="block text-xs font-semibold uppercase mb-1" style="color:var(--text-f)">Secondary Users</label>

        </div>

    function briefArchE(arch) {

        ['teamOwnership', 'Team ownership', 'Do different teams own different capabilities?'],
        ['reusability', 'Reusability', 'Would specialist agents be reusable by other orchestrators?'],
        ['instructionSize', 'Instruction size', 'Would all instructions exceed 8000 chars in one agent?'],
        ['knowledgeIsolation', 'Knowledge isolation', 'Does each capability need its own deep knowledge base?'],
      ];
      const score = factorDefs.filter(([k]) => factors[k]).length;

      const triggerDefs = [
        ['Conversational', 'User sends a message in Teams or web chat'],
        ['Scheduled', 'Runs on a timer — daily, hourly, etc. (no user input)'],

        ['Direct Line', 'API-only channel for custom app integrations'],
        ['Slack', 'Cross-posted via connector to Slack workspaces'],
        ['Mobile app', 'Embedded in a native mobile application'],
      ];
      const curTriggers = (arch.triggers || []).map(t => typeof t === 'object' ? t.type : t);
      const curChannels = (arch.channels || []).map(c => typeof c === 'object' ? c.name : c);

      return `<div class="space-y-5">

          <div class="space-y-2">${factorDefs.map(([key, label, question]) => `
            <label class="flex items-start gap-3 p-2.5 rounded-lg cursor-pointer transition-colors" style="border:1px solid ${factors[key]?'var(--accent)':'var(--border)'};background:${factors[key]?'var(--accent-bg)':'transparent'}">
              <input type="checkbox" name="factor_${key}" ${factors[key]?'checked':''} class="mt-0.5">
              <div><div class="text-sm font-medium" style="color:var(--text)">${label}</div><div class="text-xs" style="color:var(--text-m)">${question}</div></div>
            </label>
          `).join('')}</div>
          <div class="mt-2 text-xs font-semibold" style="color:var(--accent)">Score: ${score}/6 → ${score <= 2 ? 'Single Agent' : 'Multi-Agent'}</div>
        </div>
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold uppercase mb-2" style="color:var(--text-f)">How does the agent activate?</label>

              <label class="flex items-start gap-2 text-xs py-0.5 cursor-pointer">
                <input type="checkbox" name="trigger" value="${type}" ${curTriggers.includes(type)?'checked':''} class="mt-0.5">
                <div><span class="font-semibold" style="color:var(--text-s)">${type}</span><div class="text-[10px]" style="color:var(--text-f)">${desc}</div></div>
              </label>`).join('')}</div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-2" style="color:var(--text-f)">Where do users interact?</label>
            <div class="space-y-1.5">${channelDefs.map(([name, desc]) => `
              <label class="flex items-start gap-2 text-xs py-0.5 cursor-pointer">
                <input type="checkbox" name="channel" value="${name}" ${curChannels.includes(name)?'checked':''} class="mt-0.5">
                <div><span class="font-semibold" style="color:var(--text-s)">${name}</span><div class="text-[10px]" style="color:var(--text-f)">${desc}</div></div>

    function esc(val) { return (val || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

    // --- Collect edited data from a brief section ---

    function collectBriefEdit(id) {
      const el = document.getElementById(`section-${id}`);
      if (!el) return;
      switch (id) {
        case 'business': {
          const s = wizardState.business = wizardState.business || {};
          el.querySelectorAll('[data-field]').forEach(f => {
            const key = f.dataset.field.split('.')[1];
            s[key] = f.value;
          });
          break;
        }
        case 'agent': {
          const s = wizardState.agent = wizardState.agent || {};
          el.querySelectorAll('[data-field]').forEach(f => {
            const key = f.dataset.field.split('.')[1];
            s[key] = f.value;
          });
          break;
        }
        case 'capabilities': {
          wizardState.capabilities = []; let i = 0;
          while (el.querySelector(`[name="cap_name_${i}"]`)) {
            const phase = el.querySelector(`[name="cap_phase_${i}"]`).value;
            const reasonEl = el.querySelector(`[name="cap_reason_${i}"]`);
            wizardState.capabilities.push({
              name: el.querySelector(`[name="cap_name_${i}"]`).value,
              phase: phase,
              reason: (phase === 'future' && reasonEl) ? reasonEl.value : '',
              dataSources: [],
            });
            i++;
          }
          break;
        }
        case 'integrations': {
          wizardState.integrations = []; let i = 0;
          while (el.querySelector(`[name="integ_name_${i}"]`)) {
            wizardState.integrations.push({
              name: el.querySelector(`[name="integ_name_${i}"]`).value,
              type: el.querySelector(`[name="integ_type_${i}"]`).value,
              purpose: el.querySelector(`[name="integ_purpose_${i}"]`).value,
              phase: el.querySelector(`[name="integ_phase_${i}"]`).value,
            });
            i++;
          }
          break;
        }
        case 'knowledge': {
          wizardState.knowledge = []; let i = 0;
          while (el.querySelector(`[name="k_name_${i}"]`)) {
            wizardState.knowledge.push({
              name: el.querySelector(`[name="k_name_${i}"]`).value,
              type: el.querySelector(`[name="k_type_${i}"]`).value,
              purpose: (el.querySelector(`[name="k_purpose_${i}"]`) || {}).value || '',
            });
            i++;
          }
          break;
        }
        case 'conversations': {
          const c = wizardState.conversations = wizardState.conversations || {};
          c.topics = []; let i = 0;
          while (el.querySelector(`[name="topic_name_${i}"]`)) {
            c.topics.push({
              name: el.querySelector(`[name="topic_name_${i}"]`).value,
              description: el.querySelector(`[name="topic_desc_${i}"]`).value,
              triggerType: el.querySelector(`[name="topic_trigger_${i}"]`).value,
              topicType: el.querySelector(`[name="topic_type_${i}"]`).value,
            });
            i++;
          }
          break;
        }
        case 'boundaries': {
          const b = wizardState.boundaries = wizardState.boundaries || {};
          b.handle = []; let hi = 0;
          while (el.querySelector(`[name="handle_${hi}"]`)) {
            const v = el.querySelector(`[name="handle_${hi}"]`).value.trim();
            if (v) b.handle.push(v);
            hi++;
          }
          b.decline = []; let di = 0;
          while (el.querySelector(`[name="decline_topic_${di}"]`)) {
            const topic = el.querySelector(`[name="decline_topic_${di}"]`).value.trim();
            const redirect = el.querySelector(`[name="decline_redirect_${di}"]`).value.trim();
            if (topic) b.decline.push({ topic, redirect });
            di++;
          }
          b.refuse = []; let ri = 0;
          while (el.querySelector(`[name="refuse_topic_${ri}"]`)) {
            const topic = el.querySelector(`[name="refuse_topic_${ri}"]`).value.trim();
            const reason = el.querySelector(`[name="refuse_reason_${ri}"]`).value.trim();
            if (topic) b.refuse.push({ topic, reason });
            ri++;
          }
          break;
        }
        case 'architecture': {
          const a = wizardState.architecture = wizardState.architecture || {};
          // Collect 6-factor checkboxes
          const factorKeys = ['domainSeparation','dataIsolation','teamOwnership','reusability','instructionSize','knowledgeIsolation'];
          a.factors = a.factors || {};
          factorKeys.forEach(k => { a.factors[k] = !!el.querySelector(`[name="factor_${k}"]`)?.checked; });
          const score = factorKeys.filter(k => a.factors[k]).length;
          a.score = score;
          a.type = score <= 2 ? 'Single Agent' : 'Multi-Agent';
          // Triggers with descriptions
          const triggerDescs = { 'Conversational': 'User sends a message', 'Scheduled': 'Runs on a timer', 'Event-driven': 'Fires on system events', 'Autonomous': 'Multi-step independent execution' };
          a.triggers = [...el.querySelectorAll('[name="trigger"]:checked')].map(e => ({ type: e.value, description: triggerDescs[e.value] || '' }));
          // Channels with descriptions
          const channelDescs = { 'Microsoft Teams': 'Chat within Teams', 'M365 Copilot': 'Plugin in M365 Copilot', 'Web chat': 'Embedded on website', 'Direct Line': 'API-only', 'Slack': 'Via connector', 'Mobile app': 'Embedded in app' };
          a.channels = [...el.querySelectorAll('[name="channel"]:checked')].map(e => ({ name: e.value, reason: channelDescs[e.value] || '' }));
          break;
        }
        case 'scenarios': {
          wizardState.scenarios = []; let i = 0;
          while (el.querySelector(`[name="scenario_user_${i}"]`)) {
            wizardState.scenarios.push({
              name: `Scenario ${i+1}`,
              userSays: el.querySelector(`[name="scenario_user_${i}"]`).value,
              agentDoes: el.querySelector(`[name="scenario_agent_${i}"]`).value,
              category: 'happy-path',
              capabilities: [],
            });
            i++;
          }
          break;
        }
        case 'evals': {
          wizardState.evals = []; let i = 0;
          while (el.querySelector(`[name="eval_q_${i}"]`)) {
            wizardState.evals.push({ question: el.querySelector(`[name="eval_q_${i}"]`).value, expected: el.querySelector(`[name="eval_exp_${i}"]`).value, method: el.querySelector(`[name="eval_method_${i}"]`).value, score: el.querySelector(`[name="eval_score_${i}"]`).value });
            i++;
          }
          break;
        }
        case 'questions': {
          const collected = []; let i = 0;
          while (el.querySelector(`[name="oq_q_${i}"]`)) {
            const q = el.querySelector(`[name="oq_q_${i}"]`).value.trim();
            const a = el.querySelector(`[name="oq_a_${i}"]`).value.trim();
            if (q || a) collected.push({ question: q, answer: a });
            i++;
          }
          wizardState.openQuestions = collected;
          break;
        }
      }
    }

      renderBrief(); editBriefSection('questions');
      setTimeout(() => {
        const idx = wizardState.openQuestions.length - 1;
        const el = document.querySelector(`[name="oq_q_${idx}"]`);
        if (el) el.focus();
      }, 100);

    function removeQuestionBrief(idx) {
      if (briefEditSection === 'questions') collectBriefEdit('questions');
      wizardState.openQuestions = wizardState.openQuestions || [];
      wizardState.openQuestions.splice(idx, 1);
      if (!wizardState.openQuestions.length) wizardState.openQuestions.push({ question: '', answer: '' });
      briefEditSection = null;
      renderBrief(); editBriefSection('questions');
    }

    function handleQSave(e, idx) {
      // Shift+Enter or Ctrl+Enter = new line (default textarea behavior)
      if (e.key === 'Enter' && (e.shiftKey || e.ctrlKey)) return;
      // Plain Enter = save this question (flash green border, blur)
      if (e.key === 'Enter') {
        e.preventDefault();
        const card = document.getElementById(`oq-card-${idx}`);
        if (card) {
          card.style.borderColor = 'var(--green)';
          setTimeout(() => { card.style.borderColor = ''; }, 800);
        }
        e.target.blur();
      }
    }

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // --- Readiness panel ---

    function renderReadinessPanel(biz, agent, caps, integ, know, convos, bounds, arch, scenarios, evals, openQs) {
      const scenarioList = (scenarios || []).filter(s => s.userSays);
      const integList = (integ || []).filter(i => i.name);
      const topics = convos?.topics || [];
      const knowledge = (know || []).filter(k => k.name);
      const unanswered = (openQs || []).filter(q => q.question && !q.answer);
      const evalResults = wizardState.evalResults || {};
      const buildStatus = wizardState.buildStatus || {};
      const chanLen = (arch?.channels || []).filter(c => (typeof c === 'object' ? c.name : c)).length;

      const checks = [
        { label: 'Business context', ok: !!(biz?.problemStatement || biz?.useCase) },
        { label: 'Architecture', ok: !!(arch?.type) },
        { label: 'Instructions', ok: !!wizardState.instructions },
        { label: 'Integrations', ok: (integList.length + topics.length) > 0 },
        { label: 'Knowledge', ok: knowledge.length > 0 },
        { label: 'Scenarios', ok: scenarioList.length >= 3 },
        { label: 'Evals defined', ok: (evals || []).length > 0 },
        { label: 'Boundaries', ok: !!(bounds?.handle?.length || bounds?.decline?.length || bounds?.refuse?.length) },
        { label: 'Channels', ok: chanLen > 0 },
        { label: 'Questions resolved', ok: unanswered.length === 0 },
        { label: 'Build published', ok: buildStatus.status === 'published' },
        { label: 'Eval results', ok: !!(evalResults.summary && evalResults.summary.total > 0) },
      ];
      const done = checks.filter(c => c.ok).length;
      const total = checks.length;
      const pct = Math.round((done / total) * 100);
      const color = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
      const circumference = 2 * Math.PI * 30;
      const offset = circumference - (pct / 100) * circumference;

      document.getElementById('readiness-panel').innerHTML = `
        <div class="text-center mb-4">
          <div class="readiness-ring mx-auto">
            <svg width="72" height="72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--bg-s3)" stroke-width="5"/><circle cx="36" cy="36" r="30" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.6s ease"/></svg>
            <div class="absolute inset-0 flex items-center justify-center"><span class="text-lg font-bold" style="color:${color}">${pct}%</span></div>
          </div>
          <div class="text-xs font-semibold mt-1" style="color:var(--text-m)">Build Readiness</div>
        </div>
        <div class="space-y-1">
          ${checks.map(c => `
            <div class="flex items-center gap-2 text-xs" style="color:${c.ok ? 'var(--green)' : 'var(--text-f)'}">
              ${c.ok
                ? '<svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
                : '<svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>'}
              ${c.label}
            </div>
          `).join('')}
        </div>
        ${wizardState.prefilled_at ? `<div class="mt-4 pt-3 text-[10px] text-center" style="border-top:1px solid var(--border-s);color:var(--text-f)">AI-generated ${new Date(wizardState.prefilled_at).toLocaleTimeString()}</div>` : ''}
      `;
    }

    // --- Brief auto-save ---

    async function saveBriefState() {
      if (!USE_API || !wizardProjectId || !wizardAgentId) return;
      try {
        const res = await fetch(`/api/projects/${wizardProjectId}/agents/${wizardAgentId}/state`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(wizardState),
        });
        await res.json();
        // Show save indicator
        const ind = document.getElementById('save-indicator');
        ind.style.opacity = '1';
        setTimeout(() => ind.style.opacity = '0', 2000);
      } catch (e) {
        console.error('Save failed', e);
      }
    }

    // --- Build ---
    function triggerBuildForAgent(projectId, agentId, agentName) {
      if (!USE_API) { toast('Build requires the API server', 'error'); return; }
      const cmd = `/mcs-build ${projectId} ${agentId}`;
      sendTerminalCommand(cmd, { projectId });
    }

    async function triggerBuild() {
      if (!USE_API || !wizardProjectId || !wizardAgentId) {
        toast('Build requires the API server', 'error');
        return;
      }

      // Save any pending UI edits first
      await saveBriefState();

      const cmd = `/mcs-build ${wizardProjectId} ${wizardAgentId}`;
      sendTerminalCommand(cmd, { projectId: wizardProjectId });
    }

    function triggerEval() {
      if (!USE_API || !wizardProjectId || !wizardAgentId) {
        toast('Evaluate requires the API server', 'error');
        return;
      }
      const cmd = `/mcs-eval ${wizardProjectId} ${wizardAgentId}`;
      sendTerminalCommand(cmd, {
        projectId: wizardProjectId,
        onRefresh: async () => {
          try {
            const agentData = await fetch(`/api/projects/${wizardProjectId}/agents/${wizardAgentId}`).then(r => r.json());
            if (agentData.brief) {
              wizardState = agentData.brief;
              renderBrief();
            }
          } catch {}
        }
      });
    }

      }

      // Footer
      html += `<div style="padding:32px 0;text-align:center;color:#94a3b8;font-size:11px">
          Generated on ${today} &nbsp;|&nbsp; Powered by CAD Agent Builder
        </div>
      </div>`;

      // Generate PDF
      toast('Generating PDF...', 'info');
      const container = document.createElement('div');
      container.innerHTML = html;
      document.body.appendChild(container);

      html2pdf().set({
        margin: [12, 16, 12, 16],
        filename: `${agentName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()}-report.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
      }).from(container).save().then(() => {
        document.body.removeChild(container);
        toast('Report exported as PDF', 'success');
      }).catch(err => {
        document.body.removeChild(container);
        toast('PDF export failed: ' + err.message, 'error');
      });
    }

    // =======================================================================
    // Terminal Command Helper — sends prompts to Claude Code via terminal
    // =======================================================================

    let _activePollers = [];

    function sendTerminalCommand(cmd, opts = {}) {
      // Opens terminal panel, ensures connection, sends command
      openClaudePanel();

      // Label the active tab with the command for easy identification
      if (activeTabId) {
        const shortLabel = cmd.split(' ')[0].replace('/', '');
        const agentPart = cmd.split(' ').slice(2).join(' ');
        renameTab(activeTabId, agentPart ? `${shortLabel}: ${agentPart}` : shortLabel);
      }

      const send = () => {
        if (termWs && termWs.readyState === WebSocket.OPEN) {
          termWs.send(JSON.stringify({ type: 'command', text: cmd, cols: term?.cols, rows: term?.rows }));
        }
      };

      if (termWs && termWs.readyState === WebSocket.OPEN) {
        send();
      } else {
        // No active terminal or not connected — create a new tab
        if (termTabs.length === 0) addTermTab();
        const check = setInterval(() => {
          if (termWs && termWs.readyState === WebSocket.OPEN) {
            clearInterval(check);
            send();
          }
        }, 200);
        setTimeout(() => clearInterval(check), 10000); // safety timeout
      }

      // Start polling for project file changes if project context available
      if (opts.projectId) {
        startFilePolling(opts.projectId, opts.onRefresh);
      }
    }

    function startFilePolling(projectId, onRefresh) {
      // Don't stop existing pollers — multiple commands can run in parallel tabs.
      // Each poller is scoped to its projectId and only updates if that project is still active.
      const pollId = setInterval(async () => {
        try {
          // Guard: only update if user is still viewing this project
          if (currentProject?.id !== projectId) return;

          const proj = await fetch(`/api/projects/${projectId}`).then(r => r.json());
          const newAgentCount = (proj.agents || []).length;
          const newDocCount = (proj.docs || []).length;

          // Re-check after async fetch — user might have navigated during the request
          if (currentProject?.id !== projectId) return;

          const lastAgentCount = (currentProject?.agents || []).length;
          const lastDocCount = (currentProject?.docs || []).length;
          const agentBriefChanged = (proj.agents || []).some(a => {
            const old = (currentProject?.agents || []).find(o => o.id === a.id);
            return !old || old.has_brief !== a.has_brief || old.readiness !== a.readiness;
          });
          if (newAgentCount !== lastAgentCount || newDocCount !== lastDocCount || agentBriefChanged) {
            currentProject = proj;
            renderProjectView();
            renderSidebar();
            if (onRefresh) onRefresh(proj);
          }
        } catch {}
      }, 3000);

      // Auto-stop after 5 minutes (commands shouldn't take longer)
      setTimeout(() => clearInterval(pollId), 300000);

      // Track for manual cleanup
      _activePollers.push(pollId);
    }

    function stopFilePolling() {
      _activePollers.forEach(id => clearInterval(id));
      _activePollers = [];
    }

    // =======================================================================
    // Claude Code Terminal Panel (xterm.js + WebSocket)
    // =======================================================================

    // =======================================================================
    // Multi-tab terminal — each tab is an independent Claude Code instance
    // =======================================================================

    let panelOpen = false;
    let termTabs = [];      // [{id, label, term, ws, fitAddon, el}]
    let activeTabId = null;
    let tabCounter = 0;

    // Backward-compat aliases for sendTerminalCommand
    function _getActiveTerm() { return termTabs.find(t => t.id === activeTabId); }
    Object.defineProperty(window, 'termWs', { get() { const t = _getActiveTerm(); return t ? t.ws : null; } });
    Object.defineProperty(window, 'term', { get() { const t = _getActiveTerm(); return t ? t.term : null; } });
    Object.defineProperty(window, 'fitAddon', { get() { const t = _getActiveTerm(); return t ? t.fitAddon : null; } });

    const TERM_THEME = {
      background: '#0f172a', foreground: '#e2e8f0', cursor: '#818cf8', cursorAccent: '#0f172a',
      selectionBackground: '#334155',
      black: '#1e293b', red: '#ef4444', green: '#22c55e', yellow: '#eab308',
      blue: '#3b82f6', magenta: '#a855f7', cyan: '#06b6d4', white: '#e2e8f0',
      brightBlack: '#475569', brightRed: '#f87171', brightGreen: '#4ade80', brightYellow: '#facc15',
      brightBlue: '#60a5fa', brightMagenta: '#c084fc', brightCyan: '#22d3ee', brightWhite: '#f8fafc',
    };

    function toggleClaudePanel() {
      panelOpen = !panelOpen;
      document.getElementById('claude-panel').classList.toggle('open', panelOpen);
      document.querySelector('main').classList.toggle('panel-open', panelOpen);
      document.getElementById('panel-toggle-btn').style.display = panelOpen ? 'none' : '';

      if (panelOpen && termTabs.length === 0) {
        addTermTab();
      }
      if (panelOpen) {
        setTimeout(() => {
          const tab = _getActiveTerm();
          if (tab) { tab.fitAddon.fit(); tab.term.focus(); }
        }, 150);
      }
    }

    function openClaudePanel() {
      if (!panelOpen) toggleClaudePanel();
    }

    function addTermTab(label) {
      const id = ++tabCounter;
      const tabLabel = label || `Session ${id}`;
      const container = document.getElementById('terminal-container');

      // Create terminal wrapper div (hidden until activated)
      const wrapEl = document.createElement('div');
      wrapEl.id = `term-wrap-${id}`;
      wrapEl.style.cssText = 'position:absolute;inset:0;display:none;padding:4px';
      container.appendChild(wrapEl);

      // Create xterm instance
      const t = new Terminal({
        theme: TERM_THEME,
        fontSize: 13,
        fontFamily: "'Cascadia Code', 'Consolas', 'Monaco', monospace",
        cursorBlink: true, cursorStyle: 'bar', scrollback: 10000, allowTransparency: true,
      });
      const fit = new FitAddon.FitAddon();
      t.loadAddon(fit);
      t.loadAddon(new WebLinksAddon.WebLinksAddon());
      t.open(wrapEl);

      // Connect WebSocket
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = location.hostname || 'localhost';
      const ws = new WebSocket(`${protocol}//${host}:8001/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'init', cols: t.cols, rows: t.rows }));
        updateTabStatus(id, 'running');
      };
      ws.onmessage = (e) => { t.write(e.data); t.scrollToBottom(); };
      ws.onclose = () => { updateTabStatus(id, 'stopped'); };
      ws.onerror = () => { updateTabStatus(id, 'error'); };

      // Wire IO
      t.onData(data => { if (ws.readyState === WebSocket.OPEN) ws.send(data); });
      t.onResize(({ cols, rows }) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'resize', cols, rows }));
      });

      const tab = { id, label: tabLabel, term: t, ws, fitAddon: fit, el: wrapEl, status: 'starting' };
      termTabs.push(tab);
      switchTab(id);
      renderTermTabs();

      // Click container to focus active terminal
      wrapEl.addEventListener('click', () => t.focus());

      return tab;
    }

    function switchTab(id) {
      activeTabId = id;
      termTabs.forEach(t => {
        t.el.style.display = t.id === id ? 'block' : 'none';
      });
      renderTermTabs();
      setTimeout(() => {
        const tab = _getActiveTerm();
        if (tab && panelOpen) { tab.fitAddon.fit(); tab.term.focus(); }
      }, 50);
      // Update status display
      const tab = termTabs.find(t => t.id === id);
      document.getElementById('panel-status').textContent = tab ? (tab.status === 'running' ? '' : tab.status) : '';
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const idx = termTabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const tab = termTabs[idx];
      // Close websocket and dispose terminal
      try { tab.ws.close(); } catch {}
      try { tab.term.dispose(); } catch {}
      tab.el.remove();
      termTabs.splice(idx, 1);

      if (activeTabId === id) {
        // Switch to nearest tab or create new one
        if (termTabs.length > 0) {
          switchTab(termTabs[Math.min(idx, termTabs.length - 1)].id);
        } else {
          activeTabId = null;
          document.getElementById('panel-status').textContent = '';
        }
      }
      renderTermTabs();
    }

    function updateTabStatus(id, status) {
      const tab = termTabs.find(t => t.id === id);
      if (tab) tab.status = status;
      if (id === activeTabId) {
        document.getElementById('panel-status').textContent = status === 'running' ? '' : status;
      }
    }

    function renameTab(id, newLabel) {
      const tab = termTabs.find(t => t.id === id);
      if (tab) { tab.label = newLabel; renderTermTabs(); }
    }

    function renderTermTabs() {
      const container = document.getElementById('term-tabs');
      if (!container) return;
      container.innerHTML = termTabs.map(t => `
        <div onclick="switchTab(${t.id})" class="flex items-center gap-1 px-2 py-1 rounded text-[11px] cursor-pointer transition-colors shrink-0" style="background:${t.id === activeTabId ? '#1e293b' : 'transparent'};color:${t.id === activeTabId ? '#e2e8f0' : '#64748b'}">
          <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${t.status === 'running' ? '#22c55e' : t.status === 'error' ? '#ef4444' : '#64748b'}"></span>
          <span class="truncate max-w-[100px]">${t.label}</span>
          ${termTabs.length > 1 ? `<button onclick="closeTab(${t.id}, event)" class="ml-0.5 opacity-40 hover:opacity-100 transition-opacity" style="line-height:1">&times;</button>` : ''}
        </div>
      `).join('');
    }

    // Re-fit active terminal on window resize
    window.addEventListener('resize', () => {
      const tab = _getActiveTerm();
      if (tab && panelOpen) tab.fitAddon.fit();
    });

    // Legacy compat
    function newTerminal() { addTermTab(); }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =======================================================================
    // =======================================================================
    // Browser back/forward — full navigation history
    // =======================================================================
    let _navFromPop = false; // prevent double-push when popstate triggers navigation

    window.addEventListener('popstate', (e) => {
      const s = e.state;
      _navFromPop = true;
      try {
        if (!s || s.v === 'landing') {
          currentProject = null; wizardProjectId = null;
          document.getElementById('breadcrumb').innerHTML = '<span class="font-medium" style="color:var(--text)">Projects</span>';
          document.getElementById('landing-view').classList.remove('hidden');
          document.getElementById('project-view').classList.add('hidden');
          document.getElementById('wizard-view').classList.add('hidden');
          document.getElementById('doc-view').classList.add('hidden');
          renderSidebar(); renderLanding();
        } else if (s.v === 'project') { selectProject(s.id); }
        else if (s.v === 'wizard') { openWizard(s.pid, s.aid); }
        else if (s.v === 'doc') { selectProject(s.pid).then(() => openDocPage(s.key)); }
      } finally { _navFromPop = false; }
    });

    function navPush(state) { if (!_navFromPop) history.pushState(state, ''); }

    // Patch navigations to push history
    const _sp = selectProject;
    selectProject = async function(id) { navPush({v:'project',id}); return _sp(id); };
    const _ow = openWizard;
    openWizard = async function(pid,aid) { navPush({v:'wizard',pid,aid}); return _ow(pid,aid); };
    const _sl = showLanding;
    showLanding = function() { navPush({v:'landing'}); return _sl(); };
    const _odp = openDocPage;
    openDocPage = function(key) { navPush({v:'doc',pid:currentProject?.id,key}); return _odp(key); };

    // Boot
    // =======================================================================
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <!-- Fallback: load static data if not using API -->
  <script>
    if (!location.port || location.port !== '8000') {
      const s = document.createElement('script');
      s.src = 'dashboard-data.js';
      s.onerror = () => console.log('No dashboard-data.js found (expected when using API server)');
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
