<svg width="160" height="120" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="120" rx="12" fill="#F5F5F5"/>
  <!-- Phone/device shape -->
  <rect x="60" y="20" width="40" height="75" rx="6" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="65" y="28" width="30" height="55" rx="3" fill="#F9FAFB"/>
  <!-- Hexagon icon on screen -->
  <path d="M80 45 L87 48.5 L87 55.5 L80 59 L73 55.5 L73 48.5 Z" fill="url(#phoneHexGrad)"/>
  <!-- Bottom bar -->
  <rect x="72" y="88" width="16" height="3" rx="1.5" fill="#D1D5DB"/>
  <!-- Sparkle elements -->
  <circle cx="45" cy="35" r="2" fill="#D1D5DB" opacity="0.6"/>
  <circle cx="115" cy="40" r="2" fill="#D1D5DB" opacity="0.6"/>
  <circle cx="110" cy="75" r="2" fill="#D1D5DB" opacity="0.6"/>
  <defs>
    <linearGradient id="phoneHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
