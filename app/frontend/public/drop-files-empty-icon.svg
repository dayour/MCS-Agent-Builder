<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 160) rotate(90) scale(120)">
      <stop stop-color="#A7D6F0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A7D6F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="96" y1="232" x2="224" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F6FD6"/>
      <stop offset="1" stop-color="#2A8FB1"/>
    </linearGradient>
    <filter id="softShadow" x="48" y="48" width="224" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="120" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <circle cx="160" cy="160" r="80" fill="url(#core)"/>
  </g>

  <rect x="151" y="106" width="18" height="108" rx="9" fill="#BFE6F7"/>
  <rect x="106" y="151" width="108" height="18" rx="9" fill="#BFE6F7"/>
</svg>
