<svg width="240" height="160" viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="160" fill="#F9FAFB"/>

  <!-- Green circular background -->
  <circle cx="120" cy="80" r="50" fill="#10B981" opacity="0.15"/>
  <circle cx="120" cy="80" r="42" fill="#10B981" opacity="0.25"/>

  <!-- Person icon (single user for personal assistant) -->
  <g transform="translate(120, 80)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="12" fill="#059669" stroke="#047857" stroke-width="1.5"/>

    <!-- Body -->
    <path d="M -16 20 Q -16 8, -12 4 L -4 0 Q 0 -2, 4 0 L 12 4 Q 16 8, 16 20 Z"
          fill="#059669" stroke="#047857" stroke-width="1.5"/>

    <!-- Sparkle/star accent (for personal touch) -->
    <g transform="translate(24, -20)">
      <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z"
            fill="#10B981" stroke="#059669" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Decorative dots -->
  <circle cx="60" cy="40" r="3" fill="#10B981" opacity="0.3"/>
  <circle cx="180" cy="120" r="3" fill="#10B981" opacity="0.3"/>
  <circle cx="40" cy="130" r="2" fill="#059669" opacity="0.4"/>
  <circle cx="200" cy="50" r="2" fill="#059669" opacity="0.4"/>
</svg>
