# Pattern: Dashboard / KPI Card with Charts (Teams Host Extension)
# Trigger: OnRecognizedIntent (or mid-topic after data retrieval)
# Shows: Multi-metric dashboard with charts, ratings, badges via Layout.AreaGrid
# Common in: sales dashboards, team performance, service metrics, executive summaries
#
# Schema: 1.5 + Teams host extensions (Layout.AreaGrid, Chart.*, Rating, Badge)
# Channels: Teams desktop (full), Teams mobile (partial — no charts, no CodeBlock)
# Fallback: Include "fallback": "drop" on Teams-only elements for multi-channel
#
# IMPORTANT: This pattern uses Teams host extensions that ONLY render in Teams channel.
# For multi-channel agents, use the standard variant (Option B) below.

kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: "{{TOPIC_NAME}}"
    triggerQueries:
      - "{{TRIGGER_1}}"
  actions:
    # Assumes Topic.metrics populated by prior step (API call, knowledge search, etc.)
    # Topic.metrics should contain: totalRevenue, revenueGrowth, customerSat,
    # newCustomers, categoryData (array), trendData (array)

    - kind: SendMessage
      id: sendDashboardCard
      message:
        text: "Here's your dashboard:"
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              ={
                type: "AdaptiveCard",
                '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                version: "1.5",
                body: [
                  {
                    type: "TextBlock",
                    text: "{{DASHBOARD_TITLE}}",
                    weight: "Bolder",
                    size: "Large"
                  },
                  {
                    type: "TextBlock",
                    text: "Updated: " & Text(Now(), "MMM dd, yyyy h:mm AM/PM"),
                    size: "Small",
                    isSubtle: true,
                    spacing: "None"
                  },
                  {
                    type: "Container",
                    separator: true,
                    spacing: "Medium",
                    layout: {
                      type: "Layout.AreaGrid",
                      columns: [
                        { width: "1fr" },
                        { width: "1fr" },
                        { width: "1fr" }
                      ],
                      areas: [
                        { name: "kpi1", column: 1 },
                        { name: "kpi2", column: 2 },
                        { name: "kpi3", column: 3 },
                        { name: "chart1", column: 1, columnSpan: 2, row: 2 },
                        { name: "chart2", column: 3, row: 2 }
                      ]
                    },
                    items: [
                      {
                        type: "Container",
                        'layout.area': "kpi1",
                        showBorder: true,
                        roundedCorners: true,
                        items: [
                          {
                            type: "TextBlock",
                            text: "Revenue",
                            size: "Small",
                            isSubtle: true
                          },
                          {
                            type: "TextBlock",
                            text: "$" & Text(Topic.metrics.totalRevenue, "#,##0"),
                            weight: "Bolder",
                            size: "ExtraLarge",
                            spacing: "None"
                          },
                          {
                            type: "TextBlock",
                            text: If(Topic.metrics.revenueGrowth > 0, "↑ ", "↓ ") & Text(Topic.metrics.revenueGrowth, "0.0") & "%",
                            color: If(Topic.metrics.revenueGrowth > 0, "Good", "Attention"),
                            size: "Small",
                            spacing: "None"
                          }
                        ]
                      },
                      {
                        type: "Container",
                        'layout.area': "kpi2",
                        showBorder: true,
                        roundedCorners: true,
                        items: [
                          {
                            type: "TextBlock",
                            text: "Customer Satisfaction",
                            size: "Small",
                            isSubtle: true
                          },
                          {
                            type: "Rating",
                            value: Topic.metrics.customerSat,
                            max: 5,
                            color: "Marigold",
                            size: "Large",
                            fallback: "drop"
                          }
                        ]
                      },
                      {
                        type: "Container",
                        'layout.area': "kpi3",
                        showBorder: true,
                        roundedCorners: true,
                        items: [
                          {
                            type: "TextBlock",
                            text: "New Customers",
                            size: "Small",
                            isSubtle: true
                          },
                          {
                            type: "TextBlock",
                            text: Text(Topic.metrics.newCustomers, "#,##0"),
                            weight: "Bolder",
                            size: "ExtraLarge",
                            spacing: "None"
                          }
                        ]
                      },
                      {
                        type: "Container",
                        'layout.area': "chart1",
                        showBorder: true,
                        roundedCorners: true,
                        items: [{
                          type: "Chart.Line",
                          title: "Revenue Trend",
                          data: Topic.metrics.trendData,
                          fallback: "drop"
                        }]
                      },
                      {
                        type: "Container",
                        'layout.area': "chart2",
                        showBorder: true,
                        roundedCorners: true,
                        items: [{
                          type: "Chart.Donut",
                          title: "By Category",
                          data: Topic.metrics.categoryData,
                          fallback: "drop"
                        }]
                      }
                    ]
                  }
                ],
                actions: [
                  {
                    type: "Action.Submit",
                    title: "Refresh",
                    data: { action: "refresh_dashboard" }
                  },
                  {
                    type: "Action.OpenUrl",
                    title: "Full Report",
                    url: "{{REPORT_URL}}"
                  }
                ]
              }

