# --- Chart data shape reference ---
# Chart.Line/Chart.VerticalBar: data: [{ legend: "Series", values: [{ x: "Jan", y: 100 }, ...] }]
# Chart.Donut/Chart.Pie: data: [{ legend: "Category", value: 40, color: "categoricalBlue" }, ...]
