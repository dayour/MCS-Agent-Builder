name: Manifests

on:
  pull_request:

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Agent Plugins manifests
        run: node tools/validate-manifests.js --gate

      - name: Agent plugin unit tests
        run: node --test app/lib/__tests__/agent-plugins-*.test.js
