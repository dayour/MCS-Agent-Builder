name: Verify upstream-typed adapters

on:
  push:
    branches: [main, elevate-migration]
    paths:
      - 'tools/upstream-specs/**'
      - 'tools/generated/**'
      - 'tools/island-client.js'
      - 'tools/lib/http.js'
      - 'app/lib/__tests__/island-client.*'
      - 'tsconfig.tools.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-upstream.yml'
  pull_request:
    paths:
      - 'tools/upstream-specs/**'
      - 'tools/generated/**'
      - 'tools/island-client.js'
      - 'tools/lib/http.js'
      - 'app/lib/__tests__/island-client.*'
      - 'tsconfig.tools.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-upstream.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install minimal verify CLIs globally (skip ADO-hosted packages)
        run: |
          npm install -g --ignore-scripts \
            typescript@6.0.3 \
            openapi-typescript@7.13.0 \
            swagger2openapi@7.0.8
        # Why install globally instead of `npm ci`:
        # This job only needs the three CLIs above. The test step uses node:test
        # built-ins. `microsoft-agents-objectmodel` is not in package.json or
        # the lockfile (it lives on a private Azure DevOps feed).
        #
        # `npm install -g <pkg>...` ignores the project's package.json and only
        # installs the listed packages to the global prefix, where they're in
        # PATH for the verify steps below.
        #
        # To opt in locally without writing it back into package.json or the lockfile:
        #   npm run auth:ado-npm && npm install --no-save microsoft-agents-objectmodel
        # See tools/upstream-specs/auth-ado-npm.js.

      - name: Validate vendored spec provenance
        run: npm run validate:mgmt-spec

      - name: Assert generated types match regen output (drift detection)
        run: npm run assert:regen-clean

      - name: Typecheck generated mgmt-types.ts
        run: npm run typecheck:tools

      - name: Run adapter unit tests
        # Unquoted glob so bash expands it before node sees it. node --test in
        # Node 20 doesn't glob-expand quoted patterns reliably.
        run: node --test app/lib/__tests__/island-client.*.test.js
